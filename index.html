    window.onerror = function(message, source, lineno, colno, error) {
      const root = document.getElementById("root");
      if (root) {
        root.innerHTML = `
          <div style="padding:24px;color:#ef4444;background:#fef2f2;border:2px solid #fee2e2;border-radius:24px;margin:20px;font-family:'Inter',sans-serif;max-width:700px;">
            <h1 style="font-size:20px;font-weight:900;margin-bottom:12px;">Uygulama Başlatılamadı</h1>
            <p style="font-size:14px;font-weight:600;margin-bottom:8px;">Hata: ${String(message)}</p>
            <p style="font-size:12px;color:#991b1b;opacity:0.8;">Konum: ${String(source)}:${lineno}:${colno}</p>
            ${error && error.stack ? `<pre style="font-size:11px;margin-top:16px;overflow:auto;background:#fff;padding:16px;border-radius:16px;border:1px solid #fee2e2;color:#450a0a;">${String(error.stack)}</pre>` : ""}
            <button onclick="location.reload()" style="margin-top:20px;width:100%;padding:12px;background:#ef4444;color:white;border:none;border-radius:12px;font-weight:900;cursor:pointer;">Tekrar Dene</button>
          </div>
        `;
      }
      return false;
    };
  </script>

    const STORAGE_KEY = "polyglot-learner-storage-clean";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    const defaultState = {
      user: null,
      settings: {
        dailyNewWords: 5,
        targetRepetitions: 5,
        nativeLanguage: "tr",
        learningLanguage: "de",
        level: "A1",
        testSize: 10,
        darkMode: false
      },
      progress: {},
      sessionWords: []
    };

    function useAppStore() {
      const [state, setState] = useState(() => {
        const saved = loadState();
        return saved ? { ...defaultState, ...saved, settings: { ...defaultState.settings, ...(saved.settings || {}) } } : defaultState;
      });

      useEffect(() => {
        saveState(state);
      }, [state]);

      const actions = {
        setUser: (user) => setState(prev => ({ ...prev, user })),
        updateSettings: (newSettings) => setState(prev => ({
          ...prev,
          settings: { ...prev.settings, ...newSettings }
        })),
        toggleDifficult: (wordId) => setState(prev => {
          const current = prev.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
          return {
            ...prev,
            progress: {
              ...prev.progress,
              [wordId]: { ...current, isDifficult: !current.isDifficult }
            }
          };
        }),
        updateProgress: (wordId, learned) => setState(prev => {
          const current = prev.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
          const reps = learned ? prev.settings.targetRepetitions : current.repetitions + 1;
          return {
            ...prev,
            progress: {
              ...prev.progress,
              [wordId]: {
                ...current,
                repetitions: reps,
                isLearned: learned || reps >= prev.settings.targetRepetitions
              }
            }
          };
        }),
        generateSession: () => setState(prev => {
          const available = sampleWords.filter(w => !prev.progress[w.id]?.isLearned);
          return {
            ...prev,
            sessionWords: available.slice(0, prev.settings.dailyNewWords)
          };
        }),
        resetProgress: () => setState(prev => ({
          ...prev,
          progress: {},
          sessionWords: []
        }))
      };

      return [state, actions];
    }

    const AppContext = React.createContext(null);

    function AppProvider({ children }) {
      const store = useAppStore();
      return <AppContext.Provider value={store}>{children}</AppContext.Provider>;
    }

    function useStore() {
      return React.useContext(AppContext);
    }

        future: "Gelecek"

    function useTranslation() {
      const [state] = useStore();
      return (key, params = {}) => {
        let text = translations[state.settings.nativeLanguage]?.[key] || key;
        Object.entries(params).forEach(([k, v]) => {
          text = text.replace(`{${k}}`, v);
        });
        return text;
      };
    }

    function Flashcard({ word, onComplete, onDifficult }) {
      const [state] = useStore();
      const t = useTranslation();
      const [isFlipped, setIsFlipped] = useState(false);

      const displayWord = word.translations[state.settings.learningLanguage] || word.id;

      const isDifficult = state.progress[word.id]?.isDifficult;

                <div className="absolute top-6 left-6 flex items-center gap-2">

                <button

                    onComplete(true);

                >
                  <span className="text-2xl">👌</span>
                </button>

                <h2 className="font-black tracking-tighter leading-none mb-4 text-5xl" style={{ color: word.color }}>
                  {displayWord}
                </h2>

                <p className="font-medium italic text-sm" style={{ color: word.color, opacity: 0.7 }}>
                  {word.pronunciation}
                </p>

                <div className="absolute bottom-8 w-full px-8">
                  <div className="flex items-center justify-center gap-2" style={{ color: word.color, opacity: 0.6 }}>
                    <RotateCcw size={14} />
                    <span className="text-[10px] font-bold uppercase tracking-widest">Kartı çevir</span>
                  </div>
                </div>
              </div>

              <div className="flashcard-back bg-white dark:bg-neutral-800 rounded-3xl shadow-2xl border-4 text-center p-8 flex flex-col overflow-y-auto hide-scrollbar" style={{ borderColor: `${word.color}30` }}>
                <div className="flex justify-between items-start mb-6">
                  <h3 className="text-2xl font-black tracking-tight" style={{ color: word.color }}>
                    {nativeWord}
                  </h3>
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onDifficult();
                    }}
                    className={cn(
                      "p-2 rounded-xl transition-colors border-2",

                        ? "bg-orange-500 text-white border-orange-400"
                        : "bg-neutral-100 text-neutral-400 border-neutral-200 dark:border-neutral-700"
                    )}
                  >
                    <AlertTriangle size={20} />
                  </button>
                </div>

                <div className="space-y-5 text-left flex-1">
                  <div>
                    <span className="text-[10px] font-black uppercase tracking-widest opacity-60" style={{ color: word.color }}>{t("present")}</span>
                    <p className="text-sm font-bold leading-snug" style={{ color: word.color }}>{word.sentences.present.original}</p>
                    <p className="text-xs italic opacity-70" style={{ color: word.color }}>{word.sentences.present.translated}</p>
                  </div>

                  <div>
                    <span className="text-[10px] font-black uppercase tracking-widest opacity-60" style={{ color: word.color }}>{t("past")}</span>
                    <p className="text-sm font-bold leading-snug" style={{ color: word.color }}>{word.sentences.past.original}</p>
                    <p className="text-xs italic opacity-70" style={{ color: word.color }}>{word.sentences.past.translated}</p>

                  <div>

                <div className="mt-8 flex gap-3">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      onComplete(false);

                    className="flex-1 py-4 bg-neutral-100 dark:bg-neutral-700 text-neutral-600 dark:text-neutral-300 rounded-2xl font-black uppercase tracking-widest text-xs"

                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Layout() {
      const [state] = useStore();
      const t = useTranslation();
      const location = useLocation();

      const navItems = [
        { path: "/", icon: HomeIcon, label: t("home") },
        { path: "/session", icon: BookOpen, label: t("learn") },
        { path: "/difficult-words", icon: AlertTriangle, label: t("difficultWords") },
        { path: "/test", icon: BrainCircuit, label: t("test") },
        { path: "/learned", icon: CheckCircle, label: t("learned") },
        { path: "/settings", icon: SettingsIcon, label: t("settings") }
      ];

      return (
        <div className="flex flex-col h-screen bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 overflow-hidden">
          <main className="flex-1 overflow-y-auto pb-24">
            <Outlet />
          </main>

          <nav className="fixed bottom-0 w-full bg-white/80 dark:bg-neutral-950/80 backdrop-blur-lg border-t border-neutral-200 dark:border-neutral-800 px-1 py-2 pb-safe z-50">
            <div className="flex justify-around items-center max-w-screen-xl mx-auto">
              {navItems.map((item) => {
                const Icon = item.icon;
                const isActive = location.pathname === item.path;
                return (
                  <Link
                    key={item.path}
                    to={item.path}
                    className={cn(
                      "flex flex-col items-center gap-0.5 p-1.5 rounded-xl transition-all duration-200 flex-1 min-w-0 max-w-[80px]",
                      isActive ? "text-blue-600 dark:text-blue-400 scale-110" : "text-neutral-400 dark:text-neutral-500"
                    )}
                  >
                    <Icon size={20} />
                    <span className="text-[9px] font-bold uppercase tracking-tighter whitespace-nowrap overflow-hidden text-ellipsis w-full text-center">
                      {item.label}
                    </span>
                  </Link>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    function Home() {
      const [state, actions] = useStore();
      const t = useTranslation();
      const navigate = useNavigate();

      if (!state.user) return <Navigate to="/welcome" />;

      const learnedCount = Object.values(state.progress).filter(p => p.isLearned).length;
      const difficultCount = Object.values(state.progress).filter(p => p.isDifficult).length;
      const yearlyGoal = 100;
      const yearlyProgress = Math.min(100, (learnedCount / yearlyGoal) * 100);

      return (
        <div className="p-6 space-y-8 max-w-md mx-auto">
          <header className="py-8">
            <h1 className="text-4xl font-black tracking-tighter text-neutral-900 dark:text-white">
              {t("greeting")}, {state.user.name}!
            </h1>
            <p className="text-neutral-500 dark:text-neutral-400 font-medium mt-1">
              {t("readyToLearn")}
            </p>
          </header>

          <div className="grid grid-cols-2 gap-4">
            <div className="bg-blue-600 p-6 rounded-[32px] text-white shadow-xl col-span-2">
              <div className="flex justify-between items-start mb-4">
                <div className="p-3 bg-white/20 rounded-2xl">
                  <Star size={24} />
                </div>
                <span className="text-[10px] font-black uppercase tracking-widest bg-white/20 px-3 py-1 rounded-full">
                  {state.settings.level}
                </span>
              </div>

              <h3 className="text-xl font-black mb-1">{t("todaysGoal")}</h3>
              <p className="text-blue-100 text-sm font-medium mb-6">
                {state.settings.dailyNewWords} {t("words")} • {state.settings.targetRepetitions} {t("totalReps")}
              </p>

              <button
                onClick={() => {
                  actions.generateSession();
                  navigate("/session");
                }}
                className="w-full py-4 bg-white text-blue-600 rounded-2xl font-black text-sm"
              >
                {t("startTodaysSession")}
              </button>
            </div>

            <div className="bg-white dark:bg-neutral-800 p-6 rounded-[32px] border border-neutral-100 dark:border-neutral-700 col-span-2 shadow-sm">
              <div className="flex justify-between items-center mb-4">
                <h4 className="font-black text-neutral-900 dark:text-white uppercase tracking-widest text-xs">
                  {t("yearlyProgress")}
                </h4>
                <span className="text-blue-600 font-black text-lg">{learnedCount} / {yearlyGoal}</span>
              </div>
              <div className="w-full h-4 bg-neutral-100 dark:bg-neutral-700 rounded-full overflow-hidden">
                <div className="h-full bg-blue-600 rounded-full" style={{ width: `${yearlyProgress}%` }}></div>
              </div>
              <p className="text-[10px] text-neutral-400 font-bold mt-2 uppercase tracking-widest">
                %{yearlyProgress.toFixed(1)} {t("completed")}
              </p>
            </div>

            <Link to="/learned" className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 shadow-sm">
              <CheckCircle className="text-green-500 mb-3" size={24} />
              <h4 className="font-black text-neutral-900 dark:text-white">{t("learned")}</h4>
              <p className="text-2xl font-black text-neutral-900 dark:text-white">{learnedCount}</p>
            </Link>

            <Link to="/difficult-words" className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 shadow-sm">
              <AlertTriangle className="text-orange-500 mb-3" size={24} />
              <h4 className="font-black text-neutral-900 dark:text-white">{t("difficultWords")}</h4>
              <p className="text-2xl font-black text-neutral-900 dark:text-white">{difficultCount}</p>
            </Link>
          </div>
        </div>
      );
    }

    function Welcome() {
      const [state, actions] = useStore();
      const t = useTranslation();
      const navigate = useNavigate();
      const [name, setName] = useState("");

      const handleStart = () => {
        if (name.trim()) {
          actions.setUser({ name: name.trim() });
          navigate("/");
        }
      };

      return (
        <div className="min-h-screen bg-blue-600 flex flex-col items-center justify-center p-8 text-white">
          <div className="w-full max-w-sm space-y-8 text-center">
            <div className="w-24 h-24 bg-white/20 rounded-[32px] flex items-center justify-center mx-auto mb-8">
              <Languages size={48} />
            </div>

            <h1 className="text-4xl font-black tracking-tighter">{t("welcomeTitle")}</h1>
            <p className="text-blue-100 font-medium">{t("welcomeDesc")}</p>

            <div className="space-y-4 pt-8">
              <input
                type="text"
                placeholder={t("yourName")}
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full px-6 py-5 bg-white/10 border-2 border-white/20 rounded-2xl text-white placeholder:text-white/50 font-bold focus:outline-none focus:border-white/50"
              />
              <button
                onClick={handleStart}
                className="w-full py-5 bg-white text-blue-600 rounded-2xl font-black text-lg shadow-xl"
              >
                {t("startLearning")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function Session() {
      const [state, actions] = useStore();
      const t = useTranslation();
      const navigate = useNavigate();
      const [currentIndex, setCurrentIndex] = useState(0);

      if (!state.sessionWords.length) {
        return (
          <div className="p-6 flex flex-col items-center justify-center h-full text-center space-y-4">
            <div className="p-6 bg-blue-100 dark:bg-blue-900/30 text-blue-600 rounded-full">
              <CheckCircle size={48} />
            </div>
            <h2 className="text-2xl font-black">{t("allDone")}</h2>
            <p className="text-neutral-500 max-w-xs">{t("allDoneDesc")}</p>
            <button onClick={() => navigate("/")} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black">
              {t("backToHome")}
            </button>
          </div>
        );
      }

      const currentWord = state.sessionWords[currentIndex];

      const handleComplete = (learned) => {
        actions.updateProgress(currentWord.id, learned);
        if (currentIndex < state.sessionWords.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          navigate("/");
        }
      };

      return (
        <div className="p-6 h-full flex flex-col">
          <header className="flex justify-between items-center mb-8">
            <button onClick={() => navigate("/")} className="p-2 text-neutral-400"><X /></button>
            <div className="flex gap-1">
              {state.sessionWords.map((_, i) => (
                <div key={i} className={cn("h-1.5 w-6 rounded-full", i <= currentIndex ? "bg-blue-600" : "bg-neutral-200 dark:bg-neutral-700")}></div>
              ))}
            </div>
            <div className="w-10"></div>
          </header>

          <div className="flex-1 flex items-center justify-center">
            <Flashcard
              word={currentWord}
              onComplete={handleComplete}
              onDifficult={() => actions.toggleDifficult(currentWord.id)}
            />
          </div>
        </div>
      );
    }

    function DifficultWords() {
      const [state, actions] = useStore();
      const t = useTranslation();

      const difficultWords = sampleWords.filter(w => state.progress[w.id]?.isDifficult);

      return (
        <div className="p-6 max-w-md mx-auto space-y-8">
          <header className="py-8">
            <h1 className="text-3xl font-black tracking-tight flex items-center gap-3">
              <AlertTriangle size={32} className="text-orange-500" />
              {t("difficultWords")}
            </h1>
          </header>

          <div className="space-y-4">
            {difficultWords.length > 0 ? (
              difficultWords.map(word => (
                <div key={word.id} className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black uppercase tracking-tight" style={{ color: word.color }}>
                      {word.translations.de}
                    </h3>
                    <p className="font-bold" style={{ color: word.color, opacity: 0.6 }}>
                      {word.translations.tr}
                    </p>
                  </div>
                  <button onClick={() => actions.toggleDifficult(word.id)} className="p-3 text-red-500">
                    <X size={20} />
                  </button>
                </div>
              ))
            ) : (
              <div className="text-center py-12 bg-white dark:bg-neutral-800 rounded-3xl border border-dashed border-neutral-200 dark:border-neutral-700">
                <p className="text-neutral-400 font-medium">{t("noDifficultWords")}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Learned() {
      const [state, actions] = useStore();
      const t = useTranslation();

      const learnedWords = sampleWords.filter(w => state.progress[w.id]?.isLearned);

      return (
        <div className="p-6 max-w-md mx-auto space-y-8">
          <header className="py-8">
            <h1 className="text-3xl font-black tracking-tight">{t("learnedWordsTitle")}</h1>
            <p className="text-neutral-500 font-medium">{t("learnedWordsDesc", { count: learnedWords.length })}</p>
          </header>

          <div className="space-y-3">
            {learnedWords.length > 0 ? (
              learnedWords.map(word => (
                <div key={word.id} className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black uppercase tracking-tight" style={{ color: word.color }}>
                      {word.translations.de}
                    </h3>
                    <p className="font-bold" style={{ color: word.color, opacity: 0.6 }}>
                      {word.translations.tr}
                    </p>
                  </div>
                  <button onClick={() => actions.toggleDifficult(word.id)} className={cn("p-2 rounded-xl", state.progress[word.id]?.isDifficult ? "text-orange-500" : "text-neutral-300")}>
                    <AlertTriangle size={20} />
                  </button>
                </div>
              ))
            ) : (
              <div className="text-center py-12 bg-white dark:bg-neutral-800 rounded-3xl border border-dashed border-neutral-200 dark:border-neutral-700">
                <p className="text-neutral-400 font-medium">{t("noWordsLearned")}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function Test() {
      const [state, actions] = useStore();
      const t = useTranslation();
      const navigate = useNavigate();

      const learnedWords = sampleWords.filter(w => state.progress[w.id]?.isLearned);
      const isTestUnlocked = learnedWords.length >= 10;

      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selected, setSelected] = useState(null);
      const [feedback, setFeedback] = useState(null);

      if (!isTestUnlocked) {
        return (
          <div className="p-12 text-center space-y-6">
            <div className="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto">
              <AlertTriangle size={40} />
            </div>
            <h2 className="text-2xl font-black">{t("testLockMessage")}</h2>
            <button onClick={() => navigate("/")} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black">
              {t("backToHome")}
            </button>
          </div>
        );
      }

      if (currentIndex >= learnedWords.length) {
        return (
          <div className="p-8 text-center space-y-8">
            <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
              <Trophy size={48} />
            </div>
            <h2 className="text-3xl font-black">{t("testComplete")}</h2>
            <div className="bg-white dark:bg-neutral-800 p-6 rounded-3xl border border-neutral-100 dark:border-neutral-700">
              <p className="text-sm font-black uppercase text-neutral-400">{t("score")}</p>
              <p className="text-4xl font-black text-blue-600">{score}</p>
            </div>
            <button onClick={() => navigate("/")} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-lg">
              {t("backToHome")}
            </button>
          </div>
        );
      }

      const word = learnedWords[currentIndex];
      const wrongOptions = sampleWords
        .filter(w => w.id !== word.id)
        .slice(0, 3)
        .map(w => w.translations.de);

      const options = [...wrongOptions, word.translations.de].sort(() => Math.random() - 0.5);

      const handleCheck = () => {
        if (!selected) return;
        if (selected === word.translations.de) {
          setScore(prev => prev + 1);
          setFeedback("correct");
        } else {
          actions.toggleDifficult(word.id);
          setFeedback("wrong");
        }

        setTimeout(() => {
          setSelected(null);
          setFeedback(null);
          setCurrentIndex(prev => prev + 1);
        }, 1000);
      };

      return (
        <div className="p-6 max-w-md mx-auto space-y-6">
          <div className="flex justify-between items-center bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
            <span className="font-black text-xs uppercase tracking-widest text-neutral-400">
              {currentIndex + 1} / {learnedWords.length}
            </span>
            <span className="text-green-500 font-black">✓ {score}</span>
          </div>

          <div className="bg-white dark:bg-neutral-800 p-8 rounded-[40px] border-4 text-center shadow-xl" style={{ borderColor: word.color }}>
            <h2 className="text-2xl font-black leading-relaxed tracking-tight mb-3" style={{ color: word.color }}>
              {word.translations.tr}
            </h2>
            <p className="text-sm opacity-70" style={{ color: word.color }}>
              Almanca karşılığını seç
            </p>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {options.map((option, i) => (
              <button
                key={i}
                onClick={() => !feedback && setSelected(option)}
                className={cn(
                  "p-5 rounded-2xl font-bold text-sm border-2 transition-all",
                  selected === option
                    ? "bg-blue-600 text-white border-blue-600"
                    : "bg-white dark:bg-neutral-800 border-neutral-100 dark:border-neutral-700"
                )}
              >
                {option}
              </button>
            ))}
          </div>

          <div className="h-20 flex items-center justify-center">
            {feedback ? (
              <div className={cn("w-full py-4 rounded-2xl text-white font-black flex items-center justify-center gap-2", feedback === "correct" ? "bg-green-500" : "bg-red-500")}>
                {feedback === "correct" ? t("correctGuess") : t("wrongGuess")}
              </div>
            ) : (
              <button
                onClick={handleCheck}
                disabled={!selected}
                className="w-full py-5 bg-neutral-900 dark:bg-neutral-800 text-white rounded-2xl font-black text-lg disabled:opacity-50"
              >
                {t("checkAnswer")}
              </button>
            )}
          </div>
        </div>
      );
    }

    function Settings() {
      const [state, actions] = useStore();
      const t = useTranslation();
      const [localSettings, setLocalSettings] = useState(state.settings);
      const [saved, setSaved] = useState(false);

      const handleSave = () => {
        actions.updateSettings(localSettings);
        setSaved(true);
        setTimeout(() => setSaved(false), 1500);
      };

      return (
        <div className="p-6 max-w-md mx-auto space-y-8">
          <header className="py-8">
            <h1 className="text-3xl font-black tracking-tight">{t("settingsTitle")}</h1>
            <p className="text-neutral-500 font-medium">{t("settingsDesc")}</p>
          </header>

          <div className="space-y-6">
            <div className="bg-white dark:bg-neutral-800 p-6 rounded-3xl border border-neutral-100 dark:border-neutral-700 space-y-6">
              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t("dailyNewWords")}</label>
                <input
                  type="range"
                  min="3"
                  max="10"
                  step="1"
                  value={localSettings.dailyNewWords}
                  onChange={(e) => setLocalSettings({ ...localSettings, dailyNewWords: parseInt(e.target.value, 10) })}
                  className="w-full accent-blue-600"
                />
                <div className="text-center text-blue-600 font-black">{localSettings.dailyNewWords}</div>
              </div>

              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t("targetRepetitions")}</label>
                <input
                  type="range"
                  min="3"
                  max="10"
                  step="1"
                  value={localSettings.targetRepetitions}
                  onChange={(e) => setLocalSettings({ ...localSettings, targetRepetitions: parseInt(e.target.value, 10) })}
                  className="w-full accent-blue-600"
                />
                <div className="text-center text-blue-600 font-black">{localSettings.targetRepetitions}</div>
              </div>
            </div>

            <button
              onClick={handleSave}
              className={cn(
                "w-full py-5 rounded-2xl font-black text-lg flex items-center justify-center gap-2",
                saved ? "bg-green-500 text-white" : "bg-blue-600 text-white"
              )}
            >
              <Save size={18} />
              {saved ? "Kaydedildi" : t("saveSettings")}
            </button>

            <button
              onClick={() => {
                if (confirm(t("confirmDeleteAll"))) actions.resetProgress();
              }}
              className="w-full py-4 text-red-500 font-black text-sm flex items-center justify-center gap-2"
            >
              <Trash2 size={18} />
              {t("resetProgress")}
            </button>
          </div>
        </div>
      );
    }

    function App() {
      const [state] = useStore();

      useEffect(() => {
        if (state.settings.darkMode) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [state.settings.darkMode]);

      return (
        <HashRouter>
          <Routes>
            <Route path="/welcome" element={<Welcome />} />
            <Route element={<Layout />}>
              <Route path="/" element={<Home />} />
              <Route path="/session" element={<Session />} />
              <Route path="/difficult-words" element={<DifficultWords />} />
              <Route path="/learned" element={<Learned />} />
              <Route path="/settings" element={<Settings />} />
              <Route path="/test" element={<Test />} />
            </Route>
          </Routes>
        </HashRouter>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
