        window.onerror = function(message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `
                    <div style="padding: 24px; color: #ef4444; background: #fef2f2; border: 2px solid #fee2e2; border-radius: 24px; margin: 20px; font-family: 'Inter', sans-serif; max-width: 500px; mx-auto;">

                        <p style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Hata: ${message}</p>
                        <p style="font-size: 12px; color: #991b1b; opacity: 0.7;">Konum: ${source}:${lineno}:${colno}</p>
                        ${error ? `<pre style="font-size: 11px; margin-top: 16px; overflow: auto; background: #ffffff; padding: 16px; border-radius: 16px; border: 1px solid #fee2e2; color: #450a0a;">${error.stack}</pre>` : ''}
                        <button onclick="location.reload()" style="margin-top: 20px; width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer;">Tekrar Dene</button>
                    </div>
                `;
            }
            return false;
        };

        // Google GenAI Global fallback or Fetch-based implementation
        let GoogleGenAI = window.googleGenAI ? window.googleGenAI.GoogleGenAI : null;
        let Type = window.googleGenAI ? window.googleGenAI.Type : { OBJECT: "OBJECT", STRING: "STRING", ARRAY: "ARRAY" };

        if (!GoogleGenAI) {
            console.warn("Google GenAI SDK not found, using fetch fallback.");
            GoogleGenAI = class {
                constructor({ apiKey }) { this.apiKey = apiKey; }
                get models() {
                    return {
                        generateContent: async (params) => {
                            const model = params.model || "gemini-3-flash-preview";
                            const isTTS = model.includes("tts");
                            const baseUrl = "https://generativelanguage.googleapis.com/v1beta/models";
                            const url = `${baseUrl}/${model}:generateContent?key=${this.apiKey}`;
                            
                            const body = {
                                contents: Array.isArray(params.contents) ? params.contents : 
                                         (typeof params.contents === 'string' ? [{ parts: [{ text: params.contents }] }] : [params.contents]),
                                generationConfig: params.config || {}
                            };

                            // Add tools if present
                            if (params.tools) body.tools = params.tools;

                            const response = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(body)
                            });
                            
                            const data = await response.json();
                            if (data.error) throw new Error(data.error.message);

                            return {
                                text: data.candidates?.[0]?.content?.parts?.[0]?.text || "",
                                candidates: data.candidates,
                                // Helper for TTS modality
                                get audio() {
                                    return data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                                }
                            };
                        }
                    };
                }
            };
        }

        // --- UTILS ---
        const cn = (...classes) => classes.filter(Boolean).join(' ');

        const highlightWord = (sentence, wordsToHighlight, color) => {
            if (!sentence || !wordsToHighlight) return sentence;
            
            // Convert to array if it's a single string
            const words = Array.isArray(wordsToHighlight) ? wordsToHighlight : [wordsToHighlight];
            
            // Escape words for regex and join with |
            const escapedWords = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
            const regex = new RegExp(`(${escapedWords})`, 'gi');
            
            const parts = sentence.split(regex);
            return parts.map((part, i) => 
                regex.test(part) ? 
                React.createElement('span', { key: i, style: { color: color, fontWeight: '900' } }, part) : 
                part
            );
        };

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;

            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);

            }

        const useTranslation = (lang) => {
            return (key, params = {}) => {
                let text = translations[lang]?.[key] || translations['en']?.[key] || key;
                Object.entries(params).forEach(([k, v]) => {
                    text = text.replace(`{${k}}`, v);
                });
                return text;
            };
        };

        // --- STORE ---
        const colors = ['#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#F97316'];

        const useStore = create(
            persist(
                (set, get) => ({
                    user: null,
                    settings: {
                        dailyNewWords: 5,
                        targetRepetitions: 5,
                        nativeLanguage: 'tr',
                        learningLanguage: 'en',
                        level: 'A1',
                        testSize: 10,
                        darkMode: false,
                        minFontSize: 4,
                        maxFontSizeMobile: 48,
                        maxFontSizeDesktop: 72,
                        geminiApiKey: ''
                    },
                    progress: {},
                    customWords: [],
                    sessionWords: [],
                    difficultSession: [],
                    isUpdatingContent: false,

                    setUser: (user) => set({ user }),
                    updateSettings: (newSettings) => set((state) => ({
                        settings: { ...state.settings, ...newSettings }
                    })),
                    
                    toggleDifficult: (wordId) => set((state) => {
                        const wordProgress = state.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
                        const newDifficultStatus = !wordProgress.isDifficult;
                        
                        return {
                            progress: {
                                ...state.progress,
                                [wordId]: { ...wordProgress, isDifficult: newDifficultStatus }
                            }
                        };
                    }),

                    addCustomWords: (newWords) => set((state) => ({
                        customWords: [...state.customWords, ...newWords]
                    })),

                    generateSession: () => {
                        const { settings, progress, customWords } = get();
                        // Simple logic for session generation
                        // In a real app, this would be more complex
                        const availableWords = [...customWords].filter(w => !progress[w.id]?.isLearned);
                        set({ sessionWords: availableWords.slice(0, settings.dailyNewWords) });
                    },

                    generateDifficultSession: () => {
                        const { progress, customWords } = get();
                        const difficultWords = [...customWords].filter(w => progress[w.id]?.isDifficult);
                        set({ difficultSession: difficultWords });
                    },

                    updateProgress: (wordId, learned) => set((state) => {
                        const current = state.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
                        return {
                            progress: {
                                ...state.progress,
                                [wordId]: { 
                                    ...current, 
                                    repetitions: learned ? state.settings.targetRepetitions : current.repetitions + 1,
                                    isLearned: learned || (current.repetitions + 1 >= state.settings.targetRepetitions)
                                }
                            }
                        };
                    }),

                    resetProgress: () => set({ progress: {}, customWords: [], sessionWords: [], difficultSession: [] }),
                }),
                { name: 'polyglot-learner-storage' }
            )
        );

        // --- AI SERVICE ---
        const getAiClient = (apiKey) => {
            if (!apiKey) return null;
            return new GoogleGenAI({ apiKey });
        };

        const generateAudio = async (text, language, apiKey) => {
            const ai = getAiClient(apiKey);
            if (!ai) return null;

            try {
                const response = await ai.models.generateContent({
                    model: "gemini-2.5-flash-preview-tts",
                    contents: [{ parts: [{ text: `Say: ${text}` }] }],
                    config: {
                        responseModalities: ['AUDIO'],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: 'Kore' },
                            },
                        },
                    },
                });
                const base64Audio = response.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (base64Audio) {
                    return `data:audio/wav;base64,${base64Audio}`;
                }
                return null;
            } catch (error) {
                console.error("Audio generation error:", error);
                return null;
            }
        };

        const translateAndEnrichWord = async (word, learningLanguage, nativeLanguage, level, apiKey) => {
            const ai = getAiClient(apiKey);
            if (!ai) return null;

            try {
                const response = await ai.models.generateContent({
                    model: "gemini-3-flash-preview",
                    contents: `Translate the word "${word}" from ${learningLanguage} to ${nativeLanguage}. 
                    The learner is at level ${level}. 
                    Provide translations for all these languages: en, tr, de, fr, es, it, pt, ru, ar, ja, zh.
                    Provide a pronunciation guide, type, example sentences for:
                    1. Present Tense (Simdiki Zaman)
                    2. Past Tense (Gecmis Zaman)
                    3. Future Tense (Gelecek Zaman)
                    Each sentence must be appropriate for level ${level}, in both ${learningLanguage} and ${nativeLanguage}.
                    Also provide a "blank" version of the ${learningLanguage} sentence where the word "${word}" (or its conjugated form) is replaced by "_____".
                    CRITICAL: For German separable verbs (trennbar), identify all parts of the verb used in the sentence (e.g., for "aufstehen", identify ["stehe", "auf"] in "Ich stehe auf").
                    Provide etymology and an image keyword.`,
                    config: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: Type.OBJECT,
                            properties: {
                                translations: { type: Type.OBJECT },
                                wordFormatted: { type: Type.STRING },
                                pronunciation: { type: Type.STRING },
                                type: { type: Type.STRING },
                                imageKeyword: { type: Type.STRING },
                                sentences: { 
                                    type: Type.OBJECT,
                                    properties: {
                                        present: { 
                                            type: Type.OBJECT, 
                                            properties: { 
                                                original: { type: Type.STRING }, 
                                                translated: { type: Type.STRING },
                                                blank: { type: Type.STRING },
                                                highlights: { type: Type.ARRAY, items: { type: Type.STRING } }
                                            } 
                                        },
                                        past: { 
                                            type: Type.OBJECT,

                if (testWords.length > 0 && currentIndex < testWords.length) {
                    const currentWord = testWords[currentIndex];
                    const tenses = ['present', 'past', 'future'];
                    const randomTense = tenses[Math.floor(Math.random() * tenses.length)];
                    setCurrentTense(randomTense);
                    setShowHint(false);
                    setAudioUrl(null);

                    // Generate audio
                    generateAudio(currentWord.translations[settings.learningLanguage], settings.learningLanguage, settings.geminiApiKey)
                        .then(url => setAudioUrl(url));

                    const correctAnswer = currentWord.translations[settings.learningLanguage];
                    const otherWords = customWords.filter(w => w.id !== currentWord.id);
                    const randomOthers = otherWords
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3)
                        .map(w => w.translations[settings.learningLanguage]);
                    
                    while (randomOthers.length < 3) {
                        randomOthers.push(`Option ${randomOthers.length + 1}`);
                    }

                    setOptions([...randomOthers, correctAnswer].sort(() => 0.5 - Math.random()));
                    setSelectedOption(null);
                    setFeedback(null);
                }
            }, [currentIndex, testWords, settings]);

            const handleCheck = () => {
                if (!selectedOption) return;
                const currentWord = testWords[currentIndex];
                const isCorrect = selectedOption === currentWord.translations[settings.learningLanguage];

                if (isCorrect) {
                    setScore(score + 1);
                    setFeedback('correct');
                } else {
                    setWrongCount(wrongCount + 1);
                    setFeedback('wrong');
                    toggleDifficult(currentWord.id);
                }

                setTimeout(() => {
                    if (currentIndex < testWords.length - 1) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        setGamePhase('finished');
                    }
                }, 2000);
            };

            if (gamePhase === 'locked') {
                return (
                    <div className="p-12 text-center space-y-6">
                        <div className="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto">
                            <AlertTriangle size={40} />
                        </div>
                        <h2 className="text-2xl font-black">{t('testLockMessage')}</h2>
                        <button onClick={() => navigate('/')} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black">
                            {t('backToHome')}
                        </button>
                    </div>
                );
            }

            if (gamePhase === 'finished') {
                return (
                    <div className="p-8 text-center space-y-8">
                        <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
                            <Trophy size={48} />
                        </div>
                        <h2 className="text-3xl font-black">{t('testComplete')}</h2>
                        <div className="grid grid-cols-3 gap-4">
                            <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                                <p className="text-[10px] font-black uppercase text-neutral-400">{t('score')}</p>
                                <p className="text-2xl font-black text-blue-600">{score}</p>
                            </div>
                            <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                                <p className="text-[10px] font-black uppercase text-neutral-400">Hata</p>
                                <p className="text-2xl font-black text-red-500">{wrongCount}</p>
                            </div>
                            <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                                <p className="text-[10px] font-black uppercase text-neutral-400">Başarı</p>
                                <p className="text-2xl font-black text-green-500">%{Math.round((score/maxRounds)*100)}</p>
                            </div>
                        </div>
                        <button onClick={() => navigate('/')} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-lg">
                            {t('backToHome')}
                        </button>
                    </div>
                );
            }

            const currentWord = testWords[currentIndex];
            if (!currentWord) return <div className="p-12 text-center"><Loader2 className="animate-spin mx-auto" /></div>;

            const sentenceData = currentWord.sentences?.[currentTense] || { blank: "_____", translated: "No hint available" };

            return (
                <div className="p-6 max-w-md mx-auto space-y-6">
                    <div className="flex justify-between items-center bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                        <span className="font-black text-xs uppercase tracking-widest text-neutral-400">{currentIndex + 1} / {maxRounds}</span>
                        <div className="flex gap-4">
                            <span className="text-green-500 font-black">✓ {score}</span>
                            <span className="text-red-500 font-black">✗ {wrongCount}</span>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-neutral-800 p-8 rounded-[40px] border-4 text-center shadow-xl relative overflow-hidden" style={{ borderColor: currentWord.color }}>
                        <div className="absolute top-4 left-4 flex gap-2">
                            <span className="px-3 py-1 rounded-full text-[10px] font-black uppercase" style={{ backgroundColor: `${currentWord.color}20`, color: currentWord.color }}>
                                {t(currentTense)}
                            </span>
                            {audioUrl && (
                                <button onClick={playAudio} className="p-1 rounded-full" style={{ backgroundColor: `${currentWord.color}10`, color: currentWord.color }}>
                                    <Volume2 size={16} />
                                </button>
                            )}
                        </div>
                        
                        <div className="py-8">
                            <h2 className="text-2xl font-black leading-relaxed tracking-tight" style={{ color: currentWord.color }}>
                                {sentenceData.blank || "_____"}
                            </h2>
                        </div>

                        <div className="mt-4">
                            {showHint ? (
                                <p className="text-sm italic font-medium animate-in fade-in slide-in-from-bottom-2" style={{ color: currentWord.color, opacity: 0.7 }}>
                                    {sentenceData.translated}
                                </p>
                            ) : (
                                <button onClick={() => setShowHint(true)} className="text-xs font-black uppercase tracking-widest flex items-center justify-center gap-1 mx-auto" style={{ color: currentWord.color }}>
                                    <Info size={14} /> {t('riddleHint')}
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        {options.map((option, i) => (
                            <button 
                                key={i}
                                onClick={() => !feedback && setSelectedOption(option)}
                                className={cn(
                                    "p-5 rounded-2xl font-bold text-sm border-2 transition-all",
                                    selectedOption === option ? "bg-blue-600 text-white border-blue-600 shadow-lg shadow-blue-200" : "bg-white dark:bg-neutral-800 border-neutral-100 dark:border-neutral-700 hover:border-blue-200"
                                )}
                            >
                                {option}
                            </button>
                        ))}
                    </div>

                    <div className="h-20 flex items-center justify-center">
                        {feedback ? (
                            <motion.div 
                                initial={{ scale: 0.9, opacity: 0 }}
                                animate={{ scale: 1, opacity: 1 }}
                                className={cn("w-full py-4 rounded-2xl text-white font-black flex items-center justify-center gap-2", feedback === 'correct' ? "bg-green-500" : "bg-red-500")}
                            >
                                {feedback === 'correct' ? <CheckCircle /> : <AlertTriangle />}
                                {feedback === 'correct' ? t('correctGuess') : t('wrongGuess')}
                            </motion.div>
                        ) : (
                            <button 
                                onClick={handleCheck}
                                disabled={!selectedOption}
                                className="w-full py-5 bg-neutral-900 dark:bg-neutral-800 text-white rounded-2xl font-black text-lg disabled:opacity-50 shadow-xl"
                            >
                                {t('checkAnswer')}
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const Settings = () => {
            const { settings, updateSettings, resetProgress } = useStore();
            const t = useTranslation(settings.nativeLanguage);
            const [localSettings, setLocalSettings] = useState(settings);
            const [isSaved, setIsSaved] = useState(false);

            const handleSave = () => {
                updateSettings(localSettings);
                setIsSaved(true);
                setTimeout(() => setIsSaved(false), 2000);
            };

            return (
                <div className="p-6 max-w-md mx-auto space-y-8">
                    <header className="py-8">
                        <h1 className="text-3xl font-black tracking-tight">{t('settingsTitle')}</h1>
                        <p className="text-neutral-500 font-medium">{t('settingsDesc')}</p>
                    </header>

                    <div className="space-y-6">
                        <div className="bg-white dark:bg-neutral-800 p-6 rounded-3xl border border-neutral-100 dark:border-neutral-700 space-y-6">
                            <div className="space-y-4">
                                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t('geminiApiKey')}</label>
                                <input 
                                    type="password" 
                                    value={localSettings.geminiApiKey}
                                    onChange={(e) => setLocalSettings({ ...localSettings, geminiApiKey: e.target.value })}
                                    className="w-full px-4 py-3 bg-neutral-50 dark:bg-neutral-900 rounded-xl border border-neutral-100 dark:border-neutral-700 focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="AI features require an API key..."
                                />
                                <p className="text-[10px] text-neutral-400 font-medium">{t('geminiApiKeyDesc')}</p>
                            </div>

                            <div className="space-y-4">
                                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t('dailyNewWords')}</label>
                                <input 
                                    type="range" min="3" max="50" step="1"
                                    value={localSettings.dailyNewWords}
                                    onChange={(e) => setLocalSettings({ ...localSettings, dailyNewWords: parseInt(e.target.value) })}
                                    className="w-full accent-blue-600"
                                />
                                <div className="flex justify-between text-xs font-bold text-neutral-500">
                                    <span>3</span>
                                    <span className="text-blue-600">{localSettings.dailyNewWords}</span>
                                    <span>50</span>
                                </div>
                            </div>

                            <div className="space-y-4">
                                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t('targetRepetitions')}</label>
                                <input 
                                    type="range" min="3" max="15" step="1"
                                    value={localSettings.targetRepetitions}
                                    onChange={(e) => setLocalSettings({ ...localSettings, targetRepetitions: parseInt(e.target.value) })}
                                    className="w-full accent-blue-600"
                                />
                                <div className="flex justify-between text-xs font-bold text-neutral-500">
                                    <span>3</span>
                                    <span className="text-blue-600">{localSettings.targetRepetitions}</span>
                                    <span>15</span>
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handleSave}
                            className={cn(
                                "w-full py-5 rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2",
                                isSaved ? "bg-green-500 text-white" : "bg-blue-600 text-white"
                            )}
                        >
                            {isSaved ? <CheckCircle /> : <Save />}
                            {isSaved ? t('autoSaved') : t('saveSettings')}
                        </button>

                        <button 
                            onClick={() => { if(confirm(t('confirmDeleteAll'))) resetProgress(); }}
                            className="w-full py-4 text-red-500 font-black text-sm flex items-center justify-center gap-2"
                        >
                            <Trash2 size={18} />
                            {t('resetProgress')}
                        </button>
                    </div>
                </div>
            );
        };

        const Learned = () => {
            const { progress, customWords, settings, toggleDifficult } = useStore();
            const t = useTranslation(settings.nativeLanguage);
            const learnedWords = customWords.filter(w => progress[w.id]?.isLearned);

            return (
                <div className="p-6 max-w-md mx-auto space-y-8">
                    <header className="py-8">
                        <h1 className="text-3xl font-black tracking-tight">{t('learnedWordsTitle')}</h1>
                        <p className="text-neutral-500 font-medium">{t('learnedWordsDesc', { count: learnedWords.length })}</p>
                    </header>

                    <div className="space-y-3">
                        {learnedWords.length > 0 ? (
                            learnedWords.map(word => (
                                <div key={word.id} className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                                    <div>
                                        <h3 className="text-lg font-black uppercase tracking-tight" style={{ color: word.color }}>{word.translations[settings.learningLanguage]}</h3>
                                        <p className="font-bold" style={{ color: word.color, opacity: 0.6 }}>{word.translations[settings.nativeLanguage]}</p>
                                    </div>
                                    <button onClick={() => toggleDifficult(word.id)} className={cn("p-2 rounded-xl", progress[word.id]?.isDifficult ? "text-orange-500" : "text-neutral-300")}>
                                        <AlertTriangle size={20} />
                                    </button>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-12 bg-white dark:bg-neutral-800 rounded-3xl border border-dashed border-neutral-200 dark:border-neutral-700">
                                <p className="text-neutral-400 font-medium">{t('noWordsLearned')}</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const { settings } = useStore();
            
            useEffect(() => {
                if (settings.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [settings.darkMode]);

            return (
                <HashRouter>
                    <Routes>
                        <Route path="/welcome" element={<Welcome />} />
                        <Route element={<Layout />}>
                            <Route path="/" element={<Home />} />
                            <Route path="/session" element={<Session />} />
                            <Route path="/difficult-words" element={<DifficultWords />} />
                            <Route path="/learned" element={<Learned />} />
                            <Route path="/settings" element={<Settings />} />
                            <Route path="/test" element={<Test />} />
                        </Route>
                    </Routes>
                </HashRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
