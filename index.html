            <p style="font-size:12px;color:#991b1b;opacity:0.8;">Konum: ${String(source)}:${lineno}:${colno}</p>
            ${error && error.stack ? `<pre style="font-size:11px;margin-top:16px;overflow:auto;background:#fff;padding:16px;border-radius:16px;border:1px solid #fee2e2;color:#450a0a;">${String(error.stack)}</pre>` : ""}

          </div>
        `;
      }
      return false;
    };

    const speak = (text, lang = "de-DE") => {
      try {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.8;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn("Speech synthesis unavailable", e);
      }
    };

    const highlightWord = (sentence, wordsToHighlight, color) => {
      if (!sentence || !wordsToHighlight) return sentence;
      const words = Array.isArray(wordsToHighlight) ? wordsToHighlight : [wordsToHighlight];
      const escapedWords = words
        .filter(Boolean)
        .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
        .join("|");

      if (!escapedWords) return sentence;

      const regex = new RegExp(`(${escapedWords})`, "gi");
      const parts = sentence.split(regex);

      return parts.map((part, i) =>
        regex.test(part)
          ? React.createElement("span", { key: i, style: { color, fontWeight: "900" } }, part)
          : part
      );
    };

    /* --------------------------------------------------
       LOCAL STORAGE STORE
    -------------------------------------------------- */
    function createLocalStore() {
      const STORAGE_KEY = "polyglot-learner-storage";
      const listeners = new Set();

      const defaultState = {
        user: null,
        settings: {
          dailyNewWords: 5,
          targetRepetitions: 5,
          nativeLanguage: "tr",
          learningLanguage: "de",
          level: "A1",
          testSize: 10,
          darkMode: false,
          minFontSize: 18,
          maxFontSizeMobile: 42,
          maxFontSizeDesktop: 62,
          geminiApiKey: ""
        },
        progress: {},
        customWords: [],
        sessionWords: [],
        difficultSession: [],
        isUpdatingContent: false
      };

      let state = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          return saved ? { ...defaultState, ...saved, settings: { ...defaultState.settings, ...(saved.settings || {}) } } : defaultState;
        } catch {
          return defaultState;
        }
      })();

      const save = () => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      };

      const setState = (updater) => {
        const partial = typeof updater === "function" ? updater(state) : updater;
        state = { ...state, ...partial };
        save();
        listeners.forEach((l) => l());
      };

      const getAllWords = () => {
        const byId = {};
        [...sampleWords, ...state.customWords].forEach((w) => {
          byId[w.id] = w;
        });
        return Object.values(byId);
      };

      const api = {
        getState: () => ({
          ...state,
          setUser: (user) => setState({ user }),
          updateSettings: (newSettings) => setState((s) => ({ settings: { ...s.settings, ...newSettings } })),
          toggleDifficult: (wordId) => setState((s) => {
            const current = s.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
            return {
              progress: {
                ...s.progress,
                [wordId]: { ...current, isDifficult: !current.isDifficult }
              }
            };
          }),
          addCustomWords: (newWords) => setState((s) => ({ customWords: [...s.customWords, ...newWords] })),
          generateSession: () => {
            const available = getAllWords().filter((w) => !state.progress[w.id]?.isLearned);
            setState({ sessionWords: available.slice(0, state.settings.dailyNewWords) });
          },
          generateDifficultSession: () => {
            const difficultWords = getAllWords().filter((w) => state.progress[w.id]?.isDifficult);
            setState({ difficultSession: difficultWords, sessionWords: difficultWords });
          },
          updateProgress: (wordId, learned) => setState((s) => {
            const current = s.progress[wordId] || { repetitions: 0, isLearned: false, isDifficult: false };
            const nextRepetitions = learned ? s.settings.targetRepetitions : current.repetitions + 1;
            return {
              progress: {
                ...s.progress,
                [wordId]: {
                  ...current,
                  repetitions: nextRepetitions,
                  isLearned: learned || nextRepetitions >= s.settings.targetRepetitions
                }
              }
            };
          }),
          resetProgress: () => setState({ progress: {}, customWords: [], sessionWords: [], difficultSession: [] })
        }),
        subscribe: (listener) => {
          listeners.add(listener);
          return () => listeners.delete(listener);
        }
      };

      return function useStore(selector = (s) => s) {
        const [, force] = useState(0);
        useEffect(() => {
          const unsub = api.subscribe(() => force((x) => x + 1));
          return unsub;
        }, []);
        return selector(api.getState());
      };
    }

    const useStore = createLocalStore();

    /* --------------------------------------------------
       AI
    -------------------------------------------------- */
    let GoogleGenAI = window.googleGenAI ? window.googleGenAI.GoogleGenAI : null;

    const getAiClient = (apiKey) => {
      if (!apiKey || !GoogleGenAI) return null;
      try {
        return new GoogleGenAI({ apiKey });
      } catch (e) {
        return null;
      }
    };

    const generateAudio = async (text, language, apiKey) => {
      const ai = getAiClient(apiKey);
      if (!ai) return null;

      try {
        const response = await ai.models.generateContent({
          model: "gemini-2.5-flash-preview-tts",
          contents: [{ parts: [{ text: `Say this in ${language}: ${text}` }] }],
          config: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: { voiceName: "Kore" }
              }
            }
          }
        });

        const base64Audio =
          response?.candidates?.[0]?.content?.parts?.find((p) => p.inlineData)?.inlineData?.data;

        return base64Audio ? `data:audio/wav;base64,${base64Audio}` : null;
      } catch (error) {
        console.warn("Audio generation error:", error);
        return null;
      }
    };

          <div className="space-y-4">
            <div className="relative">
              <Search className="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400" size={20} />
              <input
                type="text"
                placeholder={t("searchWords")}
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-12 pr-4 py-4 bg-white dark:bg-neutral-800 rounded-2xl border border-neutral-100 dark:border-neutral-700 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"
              />
            </div>

            {searchQuery && (
              <div className="space-y-2">
                {filteredWords.map((word) => (
                  <div key={word.id} className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                    <div>
                      <p className="font-black uppercase tracking-tight" style={{ color: word.color }}>
                        {word.translations[settings.learningLanguage]}
                      </p>
                      <p className="text-xs font-bold" style={{ color: word.color, opacity: 0.6 }}>
                        {word.translations[settings.nativeLanguage]}
                      </p>
                    </div>
                    <button
                      onClick={() => toggleDifficult(word.id)}
                      className={cn(
                        "p-2 rounded-xl",
                        progress[word.id]?.isDifficult ? "bg-red-100 text-red-600" : "bg-neutral-100 text-neutral-400"
                      )}
                    >
                      {progress[word.id]?.isDifficult ? <X size={20} /> : <Plus size={20} />}
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="space-y-4">
            <h3 className="text-sm font-black text-neutral-400 uppercase tracking-widest">
              {t("difficultWords")} ({difficultWords.length})
            </h3>
            {difficultWords.length > 0 ? (
              <div className="space-y-3">
                <button
                  onClick={() => {
                    generateDifficultSession();
                    navigate("/session");
                  }}
                  className="w-full py-4 bg-orange-500 text-white rounded-2xl font-black flex items-center justify-center gap-2"
                >
                  <Play size={20} fill="currentColor" />
                  {t("startReview")}
                </button>
                {difficultWords.map((word) => (
                  <div key={word.id} className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                    <div>
                      <h3 className="text-lg font-black uppercase tracking-tight" style={{ color: word.color }}>
                        {word.translations[settings.learningLanguage]}
                      </h3>
                      <p className="font-bold" style={{ color: word.color, opacity: 0.6 }}>
                        {word.translations[settings.nativeLanguage]}
                      </p>
                    </div>
                    <button onClick={() => toggleDifficult(word.id)} className="p-3 text-red-500">
                      <X size={20} />
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center py-12 bg-white dark:bg-neutral-800 rounded-3xl border border-dashed border-neutral-200 dark:border-neutral-700">
                <p className="text-neutral-400 font-medium">{t("noDifficultWords")}</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    const Test = () => {
      const { settings, progress, customWords, toggleDifficult } = useStore();
      const t = useTranslation(settings.nativeLanguage);
      const navigate = useNavigate();

      const allWords = [...sampleWords, ...customWords];
      const learnedWords = allWords.filter((w) => progress[w.id]?.isLearned);
      const isTestUnlocked = learnedWords.length >= 10;
      const maxRounds = Math.min(learnedWords.length, settings.testSize || 10);

      const [gamePhase, setGamePhase] = useState(isTestUnlocked ? "playing" : "locked");
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [wrongCount, setWrongCount] = useState(0);
      const [testWords, setTestWords] = useState([]);
      const [options, setOptions] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [feedback, setFeedback] = useState(null);
      const [currentTense, setCurrentTense] = useState("present");
      const [showHint, setShowHint] = useState(false);
      const [audioUrl, setAudioUrl] = useState(null);

      const playAudio = () => {
        if (audioUrl) {
          const audio = new Audio(audioUrl);
          audio.play();
        }
      };

      useEffect(() => {
        if (isTestUnlocked && gamePhase === "playing" && testWords.length === 0) {
          const shuffled = [...learnedWords].sort(() => 0.5 - Math.random());
          setTestWords(shuffled.slice(0, maxRounds));
        }
      }, [isTestUnlocked, gamePhase, learnedWords.length, maxRounds]);

      useEffect(() => {
        if (testWords.length > 0 && currentIndex < testWords.length) {
          const currentWord = testWords[currentIndex];
          const tenses = ["present", "past", "future"];
          const randomTense = tenses[Math.floor(Math.random() * tenses.length)];
          setCurrentTense(randomTense);
          setShowHint(false);
          setAudioUrl(null);

          generateAudio(
            currentWord.translations[settings.learningLanguage],
            settings.learningLanguage,
            settings.geminiApiKey
          ).then((url) => setAudioUrl(url));

          const correctAnswer = currentWord.translations[settings.learningLanguage];
          const otherWords = allWords.filter((w) => w.id !== currentWord.id);
          const randomOthers = otherWords
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map((w) => w.translations[settings.learningLanguage]);

          while (randomOthers.length < 3) {
            randomOthers.push(`Option ${randomOthers.length + 1}`);
          }

          setOptions([...randomOthers, correctAnswer].sort(() => 0.5 - Math.random()));
          setSelectedOption(null);
          setFeedback(null);
        }
      }, [currentIndex, testWords, settings.learningLanguage, settings.geminiApiKey]);

      const handleCheck = () => {
        if (!selectedOption) return;
        const currentWord = testWords[currentIndex];
        const isCorrect = selectedOption === currentWord.translations[settings.learningLanguage];

        if (isCorrect) {
          setScore((s) => s + 1);
          setFeedback("correct");
        } else {
          setWrongCount((s) => s + 1);
          setFeedback("wrong");
          if (!progress[currentWord.id]?.isDifficult) {
            toggleDifficult(currentWord.id);
          }
        }

        setTimeout(() => {
          if (currentIndex < testWords.length - 1) {
            setCurrentIndex((i) => i + 1);
          } else {
            setGamePhase("finished");
          }
        }, 1300);
      };

      if (gamePhase === "locked") {
        return (
          <div className="p-12 text-center space-y-6">
            <div className="w-20 h-20 bg-orange-100 text-orange-500 rounded-full flex items-center justify-center mx-auto">
              <AlertTriangle size={40} />
            </div>
            <h2 className="text-2xl font-black">{t("testLockMessage")}</h2>
            <button onClick={() => navigate("/")} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-black">
              {t("backToHome")}
            </button>
          </div>
        );
      }

      if (gamePhase === "finished") {
        return (
          <div className="p-8 text-center space-y-8">
            <div className="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
              <Trophy size={48} />
            </div>
            <h2 className="text-3xl font-black">{t("testComplete")}</h2>
            <div className="grid grid-cols-3 gap-4">
              <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                <p className="text-[10px] font-black uppercase text-neutral-400">{t("score")}</p>
                <p className="text-2xl font-black text-blue-600">{score}</p>
              </div>
              <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                <p className="text-[10px] font-black uppercase text-neutral-400">Hata</p>
                <p className="text-2xl font-black text-red-500">{wrongCount}</p>
              </div>
              <div className="bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
                <p className="text-[10px] font-black uppercase text-neutral-400">Başarı</p>
                <p className="text-2xl font-black text-green-500">%{maxRounds ? Math.round((score / maxRounds) * 100) : 0}</p>
              </div>
            </div>
            <button onClick={() => navigate("/")} className="w-full py-5 bg-blue-600 text-white rounded-2xl font-black text-lg">
              {t("backToHome")}
            </button>
          </div>
        );
      }

      const currentWord = testWords[currentIndex];
      if (!currentWord) {
        return <div className="p-12 text-center"><Loader2 className="animate-spin mx-auto" /></div>;
      }

      const sentenceData = currentWord.sentences?.[currentTense] || { blank: "_____", translated: "No hint available" };

      return (
        <div className="p-6 max-w-md mx-auto space-y-6">
          <div className="flex justify-between items-center bg-white dark:bg-neutral-800 p-4 rounded-2xl border border-neutral-100 dark:border-neutral-700">
            <span className="font-black text-xs uppercase tracking-widest text-neutral-400">{currentIndex + 1} / {maxRounds}</span>
            <div className="flex gap-4">
              <span className="text-green-500 font-black">✓ {score}</span>
              <span className="text-red-500 font-black">✗ {wrongCount}</span>
            </div>
          </div>

          <div className="bg-white dark:bg-neutral-800 p-8 rounded-[40px] border-4 text-center shadow-xl relative overflow-hidden" style={{ borderColor: currentWord.color }}>
            <div className="absolute top-4 left-4 flex gap-2">
              <span className="px-3 py-1 rounded-full text-[10px] font-black uppercase" style={{ backgroundColor: `${currentWord.color}20`, color: currentWord.color }}>
                {t(currentTense)}
              </span>
              {audioUrl && (
                <button onClick={playAudio} className="p-1 rounded-full" style={{ backgroundColor: `${currentWord.color}10`, color: currentWord.color }}>
                  <Volume2 size={16} />
                </button>
              )}
            </div>

            <div className="py-8">
              <h2 className="text-2xl font-black leading-relaxed tracking-tight" style={{ color: currentWord.color }}>
                {sentenceData.blank || "_____"}
              </h2>
            </div>

            <div className="mt-4">
              {showHint ? (
                <p className="text-sm italic font-medium" style={{ color: currentWord.color, opacity: 0.7 }}>
                  {sentenceData.translated}
                </p>
              ) : (
                <button onClick={() => setShowHint(true)} className="text-xs font-black uppercase tracking-widest flex items-center justify-center gap-1 mx-auto" style={{ color: currentWord.color }}>
                  <Info size={14} /> {t("riddleHint")}
                </button>
              )}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {options.map((option, i) => (
              <button
                key={i}
                onClick={() => !feedback && setSelectedOption(option)}
                className={cn(
                  "p-5 rounded-2xl font-bold text-sm border-2 transition-all",
                  selectedOption === option
                    ? "bg-blue-600 text-white border-blue-600 shadow-lg"
                    : "bg-white dark:bg-neutral-800 border-neutral-100 dark:border-neutral-700 hover:border-blue-200"
                )}
              >
                {option}
              </button>
            ))}
          </div>

          <div className="h-20 flex items-center justify-center">
            {feedback ? (
              <div
                className={cn(
                  "w-full py-4 rounded-2xl text-white font-black flex items-center justify-center gap-2",
                  feedback === "correct" ? "bg-green-500" : "bg-red-500"
                )}
              >
                {feedback === "correct" ? <CheckCircle /> : <AlertTriangle />}
                {feedback === "correct" ? t("correctGuess") : t("wrongGuess")}
              </div>
            ) : (
              <button
                onClick={handleCheck}
                disabled={!selectedOption}
                className="w-full py-5 bg-neutral-900 dark:bg-neutral-800 text-white rounded-2xl font-black text-lg disabled:opacity-50 shadow-xl"
              >
                {t("checkAnswer")}
              </button>
            )}
          </div>
        </div>
      );
    };

    const Settings = () => {
      const { settings, updateSettings, resetProgress } = useStore();
      const t = useTranslation(settings.nativeLanguage);
      const [localSettings, setLocalSettings] = useState(settings);
      const [isSaved, setIsSaved] = useState(false);

      const handleSave = () => {
        updateSettings(localSettings);
        setIsSaved(true);
        setTimeout(() => setIsSaved(false), 1800);
      };

      return (
        <div className="p-6 max-w-md mx-auto space-y-8">
          <header className="py-8">
            <h1 className="text-3xl font-black tracking-tight">{t("settingsTitle")}</h1>
            <p className="text-neutral-500 font-medium">{t("settingsDesc')}</p>
          </header>

          <div className="space-y-6">
            <div className="bg-white dark:bg-neutral-800 p-6 rounded-3xl border border-neutral-100 dark:border-neutral-700 space-y-6">
              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t("geminiApiKey")}</label>
                <input
                  type="password"
                  value={localSettings.geminiApiKey}
                  onChange={(e) => setLocalSettings({ ...localSettings, geminiApiKey: e.target.value })}
                  className="w-full px-4 py-3 bg-neutral-50 dark:bg-neutral-900 rounded-xl border border-neutral-100 dark:border-neutral-700 focus:ring-2 focus:ring-blue-500 outline-none"
                  placeholder="Optional"
                />
                <p className="text-[10px] text-neutral-400 font-medium">{t("geminiApiKeyDesc")}</p>
              </div>

              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t("dailyNewWords")}</label>
                <input
                  type="range"
                  min="3"
                  max="12"
                  step="1"
                  value={localSettings.dailyNewWords}
                  onChange={(e) => setLocalSettings({ ...localSettings, dailyNewWords: parseInt(e.target.value, 10) })}
                  className="w-full accent-blue-600"
                />
                <div className="flex justify-between text-xs font-bold text-neutral-500">
                  <span>3</span>
                  <span className="text-blue-600">{localSettings.dailyNewWords}</span>
                  <span>12</span>
                </div>
              </div>

              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">{t("targetRepetitions")}</label>
                <input
                  type="range"
                  min="3"
                  max="10"
                  step="1"
                  value={localSettings.targetRepetitions}
                  onChange={(e) => setLocalSettings({ ...localSettings, targetRepetitions: parseInt(e.target.value, 10) })}
                  className="w-full accent-blue-600"
                />
                <div className="flex justify-between text-xs font-bold text-neutral-500">
                  <span>3</span>
                  <span className="text-blue-600">{localSettings.targetRepetitions}</span>
                  <span>10</span>
                </div>
              </div>

              <div className="space-y-4">
                <label className="block text-sm font-black uppercase tracking-widest text-neutral-400">Tema</label>
                <button
                  onClick={() => setLocalSettings({ ...localSettings, darkMode: !localSettings.darkMode })}
                  className="w-full px-4 py-3 bg-neutral-50 dark:bg-neutral-900 rounded-xl border border-neutral-100 dark:border-neutral-700 text-left font-bold"
                >
                  {localSettings.darkMode ? "Koyu" : "Açık"}
                </button>
              </div>
            </div>

            <button
              onClick={handleSave}
              className={cn(
                "w-full py-5 rounded-2xl font-black text-lg shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2",
                isSaved ? "bg-green-500 text-white" : "bg-blue-600 text-white"
              )}
            >
              {isSaved ? <CheckCircle /> : <Save />}
              {isSaved ? t("autoSaved") : t("saveSettings")}
            </button>

            <button
              onClick={() => {
                if (confirm(t("confirmDeleteAll"))) resetProgress();
              }}
              className="w-full py-4 text-red-500 font-black text-sm flex items-center justify-center gap-2"
            >
              <Trash2 size={18} />
              {t("resetProgress")}
            </button>
          </div>
        </div>
      );
    };

    const Learned = () => {
      const { progress, customWords, settings, toggleDifficult } = useStore();
      const t = useTranslation(settings.nativeLanguage);
      const allWords = [...sampleWords, ...customWords];
      const learnedWords = allWords.filter((w) => progress[w.id]?.isLearned);

      return (
        <div className="p-6 max-w-md mx-auto space-y-8">
          <header className="py-8">
            <h1 className="text-3xl font-black tracking-tight">{t("learnedWordsTitle")}</h1>
            <p className="text-neutral-500 font-medium">{t("learnedWordsDesc", { count: learnedWords.length })}</p>
          </header>

          <div className="space-y-3">
            {learnedWords.length > 0 ? (
              learnedWords.map((word) => (
                <div key={word.id} className="bg-white dark:bg-neutral-800 p-5 rounded-3xl border border-neutral-100 dark:border-neutral-700 flex items-center justify-between">
                  <div>
                    <h3 className="text-lg font-black uppercase tracking-tight" style={{ color: word.color }}>
                      {word.translations[settings.learningLanguage]}
                    </h3>
                    <p className="font-bold" style={{ color: word.color, opacity: 0.6 }}>
                      {word.translations[settings.nativeLanguage]}
                    </p>
                  </div>
                  <button
                    onClick={() => toggleDifficult(word.id)}
                    className={cn("p-2 rounded-xl", progress[word.id]?.isDifficult ? "text-orange-500" : "text-neutral-300")}
                  >
                    <AlertTriangle size={20} />
                  </button>
                </div>
              ))
            ) : (
              <div className="text-center py-12 bg-white dark:bg-neutral-800 rounded-3xl border border-dashed border-neutral-200 dark:border-neutral-700">
                <p className="text-neutral-400 font-medium">{t("noWordsLearned")}</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    const App = () => {
      const { settings } = useStore();

      useEffect(() => {
        if (settings.darkMode) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      }, [settings.darkMode]);

      return (
        <HashRouter>
          <Routes>
            <Route path="/welcome" element={<Welcome />} />
            <Route element={<Layout />}>
              <Route path="/" element={<Home />} />
              <Route path="/session" element={<Session />} />
              <Route path="/difficult-words" element={<DifficultWords />} />
              <Route path="/learned" element={<Learned />} />
              <Route path="/settings" element={<Settings />} />
              <Route path="/test" element={<Test />} />
            </Route>
          </Routes>
        </HashRouter>
      );
    };

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
