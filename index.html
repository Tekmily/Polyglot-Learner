<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglot Learner - Standalone</title>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        
        body {
            font-family: var(--font-sans);
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Icons Helper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const [iconHtml, setIconHtml] = useState("");
            
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) {
                        setIconHtml(icon.toSvg({ size, class: className }));
                    }
                }
            }, [name, size, className]);

            return <span dangerouslySetInnerHTML={{ __html: iconHtml }} />;
        };

        // --- AI Analysis (Hugging Face / LibreTranslate) ---
        const HF_API_KEY = ""; // User can set this in settings or it can be a placeholder

        async function translateHF(text, from = "de", to = "tr") {
            try {
                const res = await fetch("https://libretranslate.de/translate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        q: text,
                        source: from,
                        target: to,
                        format: "text"
                    })
                });
                const data = await res.json();
                return data.translatedText || text;
            } catch (e) {
                console.error("HF Translation error:", e);
                return text;
            }
        }

        async function analyzeTypeHF(word) {
            if (!HF_API_KEY) return "noun";
            try {
                const res = await fetch(
                    "https://api-inference.huggingface.co/models/facebook/bart-large-mnli",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + HF_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            inputs: word,
                            parameters: {
                                candidate_labels: ["verb", "noun", "adjective", "adverb"]
                            }
                        })
                    }
                );
                const data = await res.json();
                return data.labels ? data.labels[0] : "noun";
            } catch (e) {
                console.error("HF Type analysis error:", e);
                return "noun";
            }
        }

        async function generateExplanationHF(word) {
            if (!HF_API_KEY) return "Açıklama alınamadı";
            try {
                const res = await fetch(
                    "https://api-inference.huggingface.co/models/google/flan-t5-base",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + HF_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            inputs: `Explain the German word '${word}' simply. Give meaning, usage and origin.`
                        })
                    }
                );
                const data = await res.json();
                return data[0]?.generated_text || "Açıklama alınamadı";
            } catch (e) {
                console.error("HF Explanation error:", e);
                return "Açıklama alınamadı";
            }
        }

        async function fullWordAnalysis(word, learningLanguage = "de", uiLanguage = "tr") {
            const [translation, type, explanation] = await Promise.all([
                translateHF(word, learningLanguage, uiLanguage),
                analyzeTypeHF(word),
                generateExplanationHF(word)
            ]);
            return { word, translation, type, explanation };
        }

        async function generateSentenceHF(word, learningLanguage = "de") {
            if (!HF_API_KEY) return `Ich benutze ${word}`;
            try {
                const res = await fetch(
                    "https://api-inference.huggingface.co/models/google/flan-t5-base",
                    {
                        method: "POST",
                        headers: {
                            "Authorization": "Bearer " + HF_API_KEY,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            inputs: `Make a simple ${learningLanguage === 'de' ? 'German' : learningLanguage} sentence using '${word}'`
                        })
                    }
                );
                const data = await res.json();
                return data[0]?.generated_text || `Ich benutze ${word}`;
            } catch (e) {
                console.error("HF Sentence error:", e);
                return `Ich benutze ${word}`;
            }
        }

        // --- Data ---
        const INITIAL_WORDS = [
            {
                id: '1',
                translations: { en: 'Apple', tr: 'Elma', de: 'Apfel', fr: 'Pomme', es: 'Manzana' },
                level: 'A1',
                type: 'noun',
                color: '#EF4444',
                pronunciation: '/ˈapfl̩/',
                imageKeyword: 'red apple',
                sentences: {
                    en: { present: 'I eat an apple every day.', past: 'I ate an apple yesterday.', future: 'I will eat an apple tomorrow.' },
                    tr: { present: 'Her gün bir elma yerim.', past: 'Dün bir elma yedim.', future: 'Yarın bir elma yiyeceğim.' },
                    de: { present: 'Ich esse jeden Tag einen Apfel.', past: 'Ich aß gestern einen Apfel.', future: 'Ich werde morgen einen Apfel essen.' }
                },
                etymology: { en: 'From Old English æppel.', tr: 'Eski Türkçe elma.', de: 'Von Althochdeutsch apful.' }
            },
            {
                id: '2',
                translations: { en: 'Book', tr: 'Kitap', de: 'Buch', fr: 'Livre', es: 'Libro' },
                level: 'A1',
                type: 'noun',
                color: '#3B82F6',
                pronunciation: '/buːx/',
                imageKeyword: 'old book',
                sentences: {
                    en: { present: 'She is reading a book.', past: 'She was reading a book.', future: 'She will be reading a book.' },
                    tr: { present: 'O bir kitap okuyor.', past: 'O bir kitap okuyordu.', future: 'O bir kitap okuyacak.' },
                    de: { present: 'Sie liest ein Buch.', past: 'Sie las ein Buch.', future: 'Sie wird ein Buch lesen.' }
                },
                etymology: { en: 'From Old English bōc.', tr: 'Arapça kitāb.', de: 'Von Althochdeutsch buoh.' }
            },
            {
                id: '3',
                translations: { en: 'Water', tr: 'Su', de: 'Wasser', fr: 'Eau', es: 'Agua' },
                level: 'A1',
                type: 'noun',
                color: '#10B981',
                pronunciation: '/ˈvasɐ/',
                imageKeyword: 'glass of water',
                sentences: {
                    en: { present: 'I drink water.', past: 'I drank water.', future: 'I will drink water.' },
                    tr: { present: 'Su içerim.', past: 'Su içtim.', future: 'Su içeceğim.' },
                    de: { present: 'Ich trinke Wasser.', past: 'Ich trank Wasser.', future: 'Ich werde Wasser trinken.' }
                },
                etymology: { en: 'From Old English wæter.', tr: 'Eski Türkçe su.', de: 'Von Althochdeutsch wazzar.' }
            },
            {
                id: '4',
                translations: { en: 'Cat', tr: 'Kedi', de: 'Katze', fr: 'Chat', es: 'Gato' },
                level: 'A1',
                type: 'noun',
                color: '#F59E0B',
                pronunciation: '/ˈkatsə/',
                imageKeyword: 'cute cat',
                sentences: {
                    en: { present: 'The cat is sleeping.', past: 'The cat was sleeping.', future: 'The cat will be sleeping.' },
                    tr: { present: 'Kedi uyuyor.', past: 'Kedi uyuyordu.', future: 'Kedi uyuyacak.' },
                    de: { present: 'Die Katze schläft.', past: 'Die Katze schlief.', future: 'Die Katze wird schlafen.' }
                },
                etymology: { en: 'From Old English catt.', tr: 'Eski Türkçe kedi.', de: 'Von Althochdeutsch kazza.' }
            },
            {
                id: '5',
                translations: { en: 'House', tr: 'Ev', de: 'Haus', fr: 'Maison', es: 'Casa' },
                level: 'A1',
                type: 'noun',
                color: '#8B5CF6',
                pronunciation: '/haʊs/',
                imageKeyword: 'modern house',
                sentences: {
                    en: { present: 'This is my house.', past: 'This was my house.', future: 'This will be my house.' },
                    tr: { present: 'Bu benim evim.', past: 'Bu benim evimdi.', future: 'Bu benim evim olacak.' },
                    de: { present: 'Das ist mein Haus.', past: 'Das war mein Haus.', future: 'Das wird mein Haus sein.' }
                },
                etymology: { en: 'From Old English hūs.', tr: 'Eski Türkçe eb/ev.', de: 'Von Althochdeutsch hūs.' }
            }
        ];

        // --- Store Logic (LocalStorage) ---
        const useStorage = () => {
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem('polyglot_standalone_v1');
                return saved ? JSON.parse(saved) : {
                    profile: { name: 'User', level: 'A1', isRegistered: true },
                    settings: { dailyCardCount: 5, targetRepetitions: 5, uiLanguage: 'tr', learningLanguage: 'de' },
                    progress: {},
                    currentSession: ['1', '2', '3', '4', '5'],
                    difficultSession: [],
                    customWords: []
                };
            });

            useEffect(() => {
                localStorage.setItem('polyglot_standalone_v1', JSON.stringify(state));
            }, [state]);

            const recordRepetition = (wordId) => {
                setState(s => {
                    const p = s.progress[wordId] || { wordId, repetitions: 0, isLearned: false, isDifficult: false };
                    const newReps = p.repetitions + 1;
                    const isLearned = newReps >= s.settings.targetRepetitions;
                    return {
                        ...s,
                        progress: {
                            ...s.progress,
                            [wordId]: { ...p, repetitions: newReps, isLearned, learnedDate: isLearned ? Date.now() : p.learnedDate }
                        }
                    };
                });
            };

            const toggleDifficult = (wordId) => {
                setState(s => {
                    const p = s.progress[wordId] || { wordId, repetitions: 0, isLearned: false, isDifficult: false };
                    const newDiff = !p.isDifficult;
                    return {
                        ...s,
                        progress: { ...s.progress, [wordId]: { ...p, isDifficult: newDiff } },
                        difficultSession: newDiff ? [...s.difficultSession, wordId] : s.difficultSession.filter(id => id !== wordId)
                    };
                });
            };

            const markAsLearned = (wordId) => {
                setState(s => {
                    const p = s.progress[wordId] || { wordId, repetitions: 0, isLearned: false, isDifficult: false };
                    return {
                        ...s,
                        progress: { ...s.progress, [wordId]: { ...p, isLearned: true, repetitions: s.settings.targetRepetitions, learnedDate: Date.now(), isDifficult: false } },
                        difficultSession: s.difficultSession.filter(id => id !== wordId)
                    };
                });
            };

            const resetRepetitions = (wordId) => {
                setState(s => {
                    const p = s.progress[wordId] || { wordId, repetitions: 0, isLearned: false, isDifficult: false };
                    return {
                        ...s,
                        progress: { ...s.progress, [wordId]: { ...p, repetitions: 0, isLearned: false } }
                    };
                });
            };

            return { state, setState, recordRepetition, toggleDifficult, markAsLearned, resetRepetitions };
        };

        // --- Components ---

        const Flashcard = ({ word, isFlipped, onFlip, onSwipeLeft, onSwipeRight, repetitionCount, targetRepetitions, currentIndex, totalCards, onIKnowThis, toggleDifficult, markAsLearned, resetRepetitions, isDifficult, settings }) => {
            const [exitX, setExitX] = useState(null);
            const [showEtymology, setShowEtymology] = useState(false);
            const timerRef = useRef(null);

            const handleDragEnd = (event, info) => {
                const threshold = 50;
                if (Math.abs(info.offset.y) > threshold && Math.abs(info.offset.y) > Math.abs(info.offset.x)) {
                    onFlip();
                } else if (Math.abs(info.offset.x) > threshold) {
                    if (info.offset.x > 0) { setExitX(200); onSwipeRight(); }
                    else { setExitX(-200); onSwipeLeft(); }
                }
            };

            const handlePointerDown = () => {
                if (isFlipped) return;
                timerRef.current = setTimeout(() => {
                    setShowEtymology(true);
                }, 600);
            };

            const handlePointerUp = () => {
                if (timerRef.current) clearTimeout(timerRef.current);
            };

            const speak = (text, lang) => {
                const u = new SpeechSynthesisUtterance(text);
                if (lang === 'de') u.lang = 'de-DE';
                else if (lang === 'tr') u.lang = 'tr-TR';
                else u.lang = 'en-US';
                speechSynthesis.cancel();
                speechSynthesis.speak(u);
            };

            return (
                <div className="relative w-full h-[70vh] max-h-[600px] max-w-sm mx-auto perspective-1000">
                    <AnimatePresence mode="wait">
                        <motion.div
                            key={isFlipped ? 'back' : 'front'}
                            initial={{ rotateX: isFlipped ? -90 : 90, opacity: 0 }}
                            animate={{ rotateX: 0, opacity: 1 }}
                            exit={{ rotateX: isFlipped ? 90 : -90, opacity: 0 }}
                            className="absolute inset-0 w-full h-full rounded-3xl shadow-2xl overflow-hidden flex flex-col border border-white/20 backdrop-blur-xl text-white bg-neutral-900"
                        >
                            <div className="absolute inset-0 bg-cover bg-center opacity-40" style={{ backgroundImage: `url(https://picsum.photos/seed/${word.imageKeyword}/800/600)` }} />
                            <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-black/40 to-black/90" />

                            <div className="relative z-10 flex justify-between items-center p-6 opacity-80 text-sm font-medium">
                                <span>Kart {currentIndex + 1} / {totalCards}</span>
                                <div className="flex items-center gap-3">
                                    <button onClick={(e) => { e.stopPropagation(); toggleDifficult(word.id); }} className={`p-1.5 rounded-full ${isDifficult ? 'text-red-500 bg-red-500/20' : ''}`}>
                                        <Icon name="AlertTriangle" size={18} />
                                    </button>
                                    <span>{repetitionCount} / {targetRepetitions}</span>
                                </div>
                            </div>

                            <div className="relative z-10 flex-1 flex flex-col items-center justify-center p-6 text-center space-y-6">
                                <div className="space-y-1 relative">
                                    <span className="text-xs uppercase tracking-widest opacity-60 font-semibold">{word.type} • {word.level}</span>
                                    <div className="flex items-center justify-center gap-2">
                                        <h2 
                                            className="text-4xl font-black uppercase tracking-tight cursor-pointer select-none" 
                                            style={{ color: word.color }}
                                            onPointerDown={handlePointerDown}
                                            onPointerUp={handlePointerUp}
                                            onPointerLeave={handlePointerUp}
                                        >
                                            {isFlipped ? word.translations[settings.uiLanguage] : word.translations[settings.learningLanguage]}
                                        </h2>
                                        {!isFlipped && (
                                            <button 
                                                onClick={() => speak(word.translations[settings.learningLanguage], settings.learningLanguage)} 
                                                className="p-1.5 bg-white/10 rounded-full hover:bg-white/20 active:scale-90 transition-all"
                                            >
                                                <Icon name="Volume2" size={18} />
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <div className="w-full space-y-4 text-left">
                                    <p className="text-lg font-medium leading-tight">
                                        {isFlipped ? word.sentences[settings.uiLanguage].present : word.sentences[settings.learningLanguage].present}
                                    </p>
                                </div>
                            </div>

                            <div className="relative z-10 p-6 pt-2 flex flex-col items-center gap-4 w-full mt-auto">
                                <div className="flex gap-2 w-full">
                                    {repetitionCount < targetRepetitions ? (
                                        <button onClick={onIKnowThis} className="flex-1 py-4 bg-green-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-green-900/20 hover:bg-green-700 transition-all active:scale-95">Biliyorum</button>
                                    ) : (
                                        <button 
                                            onClick={() => markAsLearned(word.id)} 
                                            className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-900/20 hover:bg-blue-700 transition-all active:scale-95"
                                        >
                                            Öğrendim
                                        </button>
                                    )}
                                </div>
                                <span className="opacity-40 text-[10px] uppercase tracking-widest">Çevirmek için dokun • Kaydır</span>
                            </div>
                        </motion.div>
                    </AnimatePresence>

                    <AnimatePresence>
                        {showEtymology && (
                            <motion.div 
                                initial={{ opacity: 0 }} 
                                animate={{ opacity: 1 }} 
                                exit={{ opacity: 0 }} 
                                className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm"
                                onClick={() => setShowEtymology(false)}
                            >
                                <motion.div 
                                    initial={{ scale: 0.9, y: 20 }} 
                                    animate={{ scale: 1, y: 0 }} 
                                    exit={{ scale: 0.9, y: 20 }} 
                                    className="relative w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl bg-neutral-900 text-white border border-white/20"
                                    onClick={(e) => e.stopPropagation()}
                                >
                                    <div className="p-8 flex flex-col items-center text-center space-y-6">
                                        <div className="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mb-2">
                                            <span className="text-3xl">🌱</span>
                                        </div>
                                        <div>
                                            <div className="flex items-center justify-center gap-2 mb-2">
                                                <h3 className="text-2xl font-black uppercase" style={{ color: word.color }}>
                                                    {word.translations[settings.learningLanguage]}
                                                </h3>
                                                <button 
                                                    onClick={() => speak(word.translations[settings.learningLanguage], settings.learningLanguage)}
                                                    className="p-1.5 bg-white/10 rounded-full hover:bg-white/20 active:scale-90 transition-all"
                                                >
                                                    <Icon name="Volume2" size={16} />
                                                </button>
                                            </div>
                                            <p className="text-sm uppercase tracking-widest opacity-60 font-semibold mb-4">Köken Bilgisi</p>
                                            <p className="text-lg leading-relaxed font-medium">
                                                {word.etymology[settings.uiLanguage] || word.etymology['en']}
                                            </p>
                                        </div>
                                        <button onClick={() => setShowEtymology(false)} className="w-full py-4 bg-white text-neutral-900 rounded-xl font-bold text-lg">Anladım</button>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [view, setView] = useState('home');
            const { state, recordRepetition, toggleDifficult, markAsLearned, resetRepetitions, setState } = useStorage();
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [isUpdatingContent, setIsUpdatingContent] = useState(false);
            const [isCardLoading, setIsCardLoading] = useState(false);
            const [localSettings, setLocalSettings] = useState({
                learningLanguage: state.settings.learningLanguage,
                targetRepetitions: state.settings.targetRepetitions
            });

            // Test State
            const [testState, setTestState] = useState({
                gamePhase: 'level-select',
                selectedLanguageLevel: null,
                score: 0,
                wrongCount: 0,
                level: 1,
                currentIndex: 0,
                feedback: null,
                options: [],
                currentWord: null,
                currentSentence: "",
                isSentenceLoading: false,
                learnedWordsList: [],
                difficultWordsList: [],
                testLanguage: state.settings.learningLanguage,
                targetLanguage: state.settings.uiLanguage
            });

            const MAX_ROUNDS = 10;

            const startTest = async (lvl) => {
                const allWords = [...INITIAL_WORDS];
                const levelWords = allWords.filter(w => w.level === lvl);
                
                if (levelWords.length === 0) return alert("Bu seviyede kelime bulunamadı!");
                
                const shuffled = [...levelWords].sort(() => 0.5 - Math.random());
                const word = shuffled[0];
                
                // Randomly decide which language to ask in
                const isLearningLang = Math.random() > 0.5;
                const testLang = isLearningLang ? state.settings.learningLanguage : state.settings.uiLanguage;
                let targetLang = isLearningLang ? state.settings.uiLanguage : state.settings.learningLanguage;
                
                // Fallback if they are same
                if (testLang === targetLang) {
                    targetLang = testLang === 'tr' ? 'en' : 'tr';
                }

                // Option count logic: level <= 5 -> 3, level <= 10 -> 4, level <= 20 -> 5, else 6
                let optionCount = 3;
                
                const options = [word.translations[targetLang], ...allWords.filter(w => w.id !== word.id).sort(() => 0.5 - Math.random()).slice(0, optionCount - 1).map(w => w.translations[targetLang])].sort(() => 0.5 - Math.random());
                
                setTestState(s => ({ 
                    ...s, 
                    gamePhase: 'playing',
                    selectedLanguageLevel: lvl,
                    currentIndex: 0, 
                    score: 0,
                    wrongCount: 0,
                    level: 1,
                    feedback: null, 
                    options, 
                    currentWord: word, 
                    currentSentence: "...", 
                    isSentenceLoading: true,
                    learnedWordsList: [],
                    difficultWordsList: [],
                    testLanguage: testLang,
                    targetLanguage: targetLang
                }));
                setView('test');
                
                const sentence = await generateSentenceHF(word.translations[testLang], testLang);
                setTestState(s => ({ ...s, currentSentence: sentence, isSentenceLoading: false }));
            };

            const checkAnswer = (ans) => {
                const correct = testState.currentWord.translations[testState.targetLanguage];
                const wordText = testState.currentWord.translations[state.settings.learningLanguage];
                
                if (ans === correct) {
                    const newScore = testState.score + 1;
                    setTestState(s => ({ 
                        ...s, 
                        score: newScore, 
                        feedback: 'correct', 
                        level: Math.floor(newScore / 3) + 1, // Level up every 3 correct
                        learnedWordsList: s.learnedWordsList.includes(wordText) ? s.learnedWordsList : [...s.learnedWordsList, wordText]
                    }));
                } else {
                    setTestState(s => ({ 
                        ...s, 
                        wrongCount: testState.wrongCount + 1, 
                        feedback: 'wrong',
                        difficultWordsList: s.difficultWordsList.includes(wordText) ? s.difficultWordsList : [...s.difficultWordsList, wordText]
                    }));
                }
                
                setTimeout(async () => {
                    const nextIdx = testState.currentIndex + 1;
                    if (nextIdx >= MAX_ROUNDS) return setTestState(s => ({ ...s, gamePhase: 'finished' }));
                    
                    const allWords = [...INITIAL_WORDS];
                    const levelWords = allWords.filter(w => w.level === testState.selectedLanguageLevel);
                    const shuffled = [...levelWords].sort(() => 0.5 - Math.random());
                    const nextWord = shuffled[0];

                    // Randomly decide which language to ask in
                    const isLearningLang = Math.random() > 0.5;
                    const testLang = isLearningLang ? state.settings.learningLanguage : state.settings.uiLanguage;
                    let targetLang = isLearningLang ? state.settings.uiLanguage : state.settings.learningLanguage;
                    
                    // Fallback if they are same
                    if (testLang === targetLang) {
                        targetLang = testLang === 'tr' ? 'en' : 'tr';
                    }

                    let optionCount = 3;
                    const currentLvl = Math.floor(testState.score / 3) + 1;
                    if (currentLvl > 20) optionCount = 6;
                    else if (currentLvl > 10) optionCount = 5;
                    else if (currentLvl > 5) optionCount = 4;

                    const nextOptions = [nextWord.translations[targetLang], ...allWords.filter(w => w.id !== nextWord.id).sort(() => 0.5 - Math.random()).slice(0, optionCount - 1).map(w => w.translations[targetLang])].sort(() => 0.5 - Math.random());
                    
                    setTestState(s => ({ 
                        ...s, 
                        currentIndex: nextIdx, 
                        currentWord: nextWord, 
                        options: nextOptions, 
                        feedback: null, 
                        currentSentence: "...", 
                        isSentenceLoading: true,
                        testLanguage: testLang,
                        targetLanguage: targetLang
                    }));
                    
                    const sentence = await generateSentenceHF(nextWord.translations[testLang], testLang);
                    setTestState(s => ({ ...s, currentSentence: sentence, isSentenceLoading: false }));
                }, 1500);
            };

            const [newWordInput, setNewWordInput] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [processingWord, setProcessingWord] = useState('');

            const handleAddWord = async () => {
                if (!newWordInput.trim()) return;
                setIsAnalyzing(true);
                const wordsToAdd = newWordInput.trim().split(',').map(w => w.trim()).filter(w => w.length > 0);
                
                try {
                    for (const word of wordsToAdd) {
                        setProcessingWord(word);
                        const analysis = await fullWordAnalysis(word, state.settings.learningLanguage, state.settings.uiLanguage);
                        const id = `custom_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
                        const newWord = {
                            id,
                            translations: { [state.settings.learningLanguage]: analysis.word, [state.settings.uiLanguage]: analysis.translation },
                            level: 'A1',
                            type: analysis.type,
                            color: '#3B82F6',
                            pronunciation: '',
                            imageKeyword: analysis.word,
                            sentences: {
                                [state.settings.learningLanguage]: { present: analysis.word, past: analysis.word, future: analysis.word },
                                [state.settings.uiLanguage]: { present: analysis.translation, past: analysis.translation, future: analysis.translation }
                            },
                            etymology: { [state.settings.uiLanguage]: analysis.explanation }
                        };
                        setState(s => ({ ...s, customWords: [...(s.customWords || []), newWord] }));
                    }
                    setNewWordInput('');
                    setProcessingWord('');
                } catch (e) {
                    alert("Kelime eklenirken bir hata oluştu.");
                } finally {
                    setIsAnalyzing(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col max-w-md mx-auto bg-white shadow-2xl relative overflow-hidden">
                    <AnimatePresence>
                        {isUpdatingContent && (
                            <motion.div
                                initial={{ y: -50, opacity: 0 }}
                                animate={{ y: 0, opacity: 1 }}
                                exit={{ y: -50, opacity: 0 }}
                                className="fixed top-0 left-0 right-0 z-[100] bg-blue-600 text-white py-2 px-4 flex items-center justify-center gap-3 shadow-lg max-w-md mx-auto"
                            >
                                <Icon name="Loader2" size={16} className="animate-spin" />
                                <span className="text-[10px] font-black uppercase tracking-widest">Yeni kelime kartları yükleniyor...</span>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* Header */}
                    <header className="p-6 flex justify-between items-center bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
                        <div className="flex items-center gap-2">
                            <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-200">
                                <Icon name="BrainCircuit" size={24} />
                            </div>
                            <h1 className="text-xl font-black tracking-tight">Polyglot</h1>
                        </div>
                        <button onClick={() => setView('settings')} className="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                            <Icon name="Settings" size={24} className="text-gray-500" />
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto pb-24">
                        {view === 'home' && (
                            <div className="p-6 space-y-8">
                                <div className="bg-blue-600 rounded-3xl p-8 text-white shadow-2xl shadow-blue-200 relative overflow-hidden">
                                    <div className="relative z-10 space-y-4">
                                        <h2 className="text-3xl font-black">Merhaba, {state.profile.name}!</h2>
                                        <p className="opacity-80 font-medium">Bugün {learnedWords.length} kelime öğrendin. Harika gidiyorsun!</p>
                                        <motion.button 
                                            whileHover={{ scale: 1.05 }}
                                            whileTap={{ scale: 0.95 }}
                                            animate={{ 
                                                boxShadow: ["0px 0px 0px rgba(34, 197, 94, 0)", "0px 0px 20px rgba(34, 197, 94, 0.6)", "0px 0px 0px rgba(34, 197, 94, 0)"]
                                            }}
                                            transition={{ 
                                                boxShadow: { duration: 2, repeat: Infinity, ease: "easeInOut" }
                                            }}
                                            onClick={() => setView('session')} 
                                            className="px-8 py-4 bg-green-600 text-white rounded-2xl font-black text-lg shadow-2xl active:scale-95 transition-all"
                                        >
                                            Öğrenmeye Başla
                                        </motion.button>
                                    </div>
                                    <Icon name="Trophy" size={120} className="absolute -right-8 -bottom-8 opacity-10 rotate-12" />
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => { setTestState(s => ({ ...s, gamePhase: 'level-select' })); setView('test'); }} className="p-6 bg-purple-50 rounded-3xl border border-purple-100 text-left space-y-2 hover:bg-purple-100 transition-colors">
                                        <div className="w-10 h-10 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center"><Icon name="BrainCircuit" size={20} /></div>
                                        <h3 className="font-bold text-purple-900">Test Yap</h3>
                                        <p className="text-xs text-purple-600 font-medium">Bilgini sına</p>
                                    </button>
                                    <button onClick={() => setView('difficult')} className="p-6 bg-orange-50 rounded-3xl border border-orange-100 text-left space-y-2 hover:bg-orange-100 transition-colors">
                                        <div className="w-10 h-10 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center"><Icon name="AlertTriangle" size={20} /></div>
                                        <h3 className="font-bold text-orange-900">Zor Kelimeler</h3>
                                        <p className="text-xs text-orange-600 font-medium">{state.difficultSession.length} kelime</p>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'session' && (
                            <div className="p-6 h-full flex flex-col justify-center">
                                {isCardLoading ? (
                                    <div className="flex flex-col items-center justify-center space-y-4">
                                        <div className="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                        <p className="text-blue-600 font-bold animate-pulse">Yeni kelime kartı yükleniyor...</p>
                                    </div>
                                ) : (
                                    <Flashcard 
                                        word={INITIAL_WORDS[currentIndex]}
                                        isFlipped={isFlipped}
                                        onFlip={() => setIsFlipped(!isFlipped)}
                                        onSwipeLeft={() => { 
                                            setIsCardLoading(true);
                                            setIsUpdatingContent(true);
                                            setTimeout(() => {
                                                recordRepetition(INITIAL_WORDS[currentIndex].id); 
                                                setCurrentIndex((currentIndex + 1) % INITIAL_WORDS.length); 
                                                setIsFlipped(false);
                                                setIsCardLoading(false);
                                                setIsUpdatingContent(false);
                                            }, 800);
                                        }}
                                        onSwipeRight={() => { 
                                            setIsCardLoading(true);
                                            setIsUpdatingContent(true);
                                            setTimeout(() => {
                                                setCurrentIndex((currentIndex - 1 + INITIAL_WORDS.length) % INITIAL_WORDS.length); 
                                                setIsFlipped(false);
                                                setIsCardLoading(false);
                                                setIsUpdatingContent(false);
                                            }, 800);
                                        }}
                                        repetitionCount={state.progress[INITIAL_WORDS[currentIndex].id]?.repetitions || 0}
                                        targetRepetitions={state.settings.targetRepetitions}
                                        currentIndex={currentIndex}
                                        totalCards={INITIAL_WORDS.length}
                                        onIKnowThis={() => markAsLearned(INITIAL_WORDS[currentIndex].id)}
                                        toggleDifficult={toggleDifficult}
                                        markAsLearned={markAsLearned}
                                        resetRepetitions={resetRepetitions}
                                        isDifficult={state.progress[INITIAL_WORDS[currentIndex].id]?.isDifficult}
                                        settings={state.settings}
                                    />
                                )}
                            </div>
                        )}

                        {view === 'test' && testState.gamePhase === 'level-select' && (
                            <div className="h-full flex flex-col items-center justify-center p-6 bg-neutral-50 text-center">
                                <div className="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full flex flex-col items-center space-y-6 border border-neutral-100">
                                    <div className="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shadow-inner">
                                        <Icon name="BrainCircuit" size={40} />
                                    </div>
                                    <div className="space-y-2">
                                        <h2 className="text-2xl font-black text-neutral-900">Seviye Seç</h2>
                                        <p className="text-sm text-neutral-500 font-medium">Test etmek istediğiniz dil seviyesini seçin.</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 w-full">
                                        {["A1", "A2", "B1", "B2", "C1", "C2"].map((lvl) => (
                                            <button
                                                key={lvl}
                                                onClick={() => startTest(lvl)}
                                                className="py-4 bg-neutral-50 border border-neutral-200 text-neutral-900 rounded-2xl font-black text-lg hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all active:scale-95"
                                            >
                                                {lvl}
                                            </button>
                                        ))}
                                    </div>
                                    <button
                                        onClick={() => setView('home')}
                                        className="w-full py-3 text-neutral-400 font-bold text-sm hover:text-neutral-600 transition-colors"
                                    >
                                        Vazgeç
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'test' && testState.currentWord && testState.gamePhase === 'playing' && (
                            <div className="min-h-full relative flex flex-col items-center p-6 overflow-hidden">
                                <div 
                                    className="fixed inset-0 z-0 bg-cover bg-center transition-all duration-1000"
                                    style={{ 
                                        backgroundImage: `url(https://loremflickr.com/1200/800/${testState.currentWord.imageKeyword})`,
                                        filter: 'blur(8px) brightness(0.6)'
                                    }}
                                />
                                <div className="w-full max-w-sm space-y-8 relative z-10">
                                    <div className="flex justify-between items-center bg-black/20 backdrop-blur-md p-4 rounded-3xl border border-white/10 text-white">
                                        <div className="flex flex-col">
                                            <span className="text-[10px] font-black opacity-40 uppercase tracking-widest">İlerleme</span>
                                            <span className="text-sm font-black">{testState.currentIndex + 1} / {MAX_ROUNDS}</span>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex flex-col items-center">
                                                <span className="text-[10px] font-black text-green-400/60 uppercase tracking-widest">Skor</span>
                                                <span className="text-sm font-black text-green-400">{testState.score}</span>
                                            </div>
                                            <div className="flex flex-col items-center">
                                                <span className="text-[10px] font-black text-red-400/60 uppercase tracking-widest">Hata</span>
                                                <span className="text-sm font-black text-red-400">{testState.wrongCount}</span>
                                            </div>
                                            <div className="flex flex-col items-center">
                                                <span className="text-[10px] font-black text-orange-400/60 uppercase tracking-widest">Level</span>
                                                <span className="text-sm font-black text-orange-400">{testState.level}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md rounded-3xl p-8 border border-white/20 text-center space-y-6 text-white shadow-2xl">
                                        <div className="flex flex-col items-center gap-2">
                                            <div className="flex items-center gap-2">
                                                <h2 className="text-4xl font-black uppercase tracking-tight">
                                                    {testState.currentWord.translations[testState.testLanguage]}
                                                </h2>
                                                <button 
                                                    onClick={() => speak(testState.currentWord.translations[testState.testLanguage], testState.testLanguage === 'de' ? 'de-DE' : (testState.testLanguage === 'tr' ? 'tr-TR' : 'en-US'))}
                                                    className="p-1.5 bg-white/10 text-white rounded-full hover:bg-white/20 active:scale-90 transition-all"
                                                >
                                                    <Icon name="Volume2" size={18} />
                                                </button>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <p className="text-lg italic opacity-80">
                                                    {testState.isSentenceLoading ? "..." : testState.currentSentence.replace(testState.currentWord.translations[testState.testLanguage], "____").replace(testState.currentWord.translations[testState.targetLanguage], "____")}
                                                </p>
                                                <button 
                                                    onClick={() => speak(testState.currentSentence, testState.testLanguage === 'de' ? 'de-DE' : (testState.testLanguage === 'tr' ? 'tr-TR' : 'en-US'))}
                                                    className="p-1 bg-white/10 text-white rounded-full hover:bg-white/20 active:scale-90 transition-all"
                                                >
                                                    <Icon name="Volume2" size={14} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        {testState.options.map(o => (
                                            <button key={o} onClick={() => !testState.feedback && checkAnswer(o)} className={`p-4 rounded-2xl font-bold text-sm border-2 transition-all ${testState.feedback ? (o === testState.currentWord.translations[testState.targetLanguage] ? 'bg-green-600 border-green-600 text-white' : 'bg-white/10 border-white/10 text-white') : 'bg-white/10 border-white/10 text-white hover:border-white/40'}`}>
                                                {o}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'test' && testState.gamePhase === 'finished' && (
                            <div className="min-h-full relative flex flex-col items-center justify-center p-6 overflow-hidden">
                                <div 
                                    className="fixed inset-0 z-0 bg-cover bg-center transition-all duration-1000"
                                    style={{ 
                                        backgroundImage: `url(https://loremflickr.com/1200/800/achievement)`,
                                        filter: 'blur(12px) brightness(0.4)'
                                    }}
                                />
                                <div className="fixed inset-0 z-0 bg-black/60" />
                                <div className="w-full max-w-md bg-white/10 backdrop-blur-xl p-8 rounded-[2.5rem] shadow-2xl text-center space-y-8 border border-white/20 relative z-10">
                                    <div className="w-24 h-24 rounded-full flex items-center justify-center mx-auto shadow-2xl bg-blue-500/20 text-blue-400 border border-blue-500/30">
                                        <Icon name="GraduationCap" size={48} />
                                    </div>
                                    <div className="space-y-2">
                                        <h2 className="text-4xl font-black text-white uppercase tracking-tight">Test Raporu</h2>
                                        <div className="flex justify-center gap-8 mt-4">
                                            <div className="text-center">
                                                <p className="text-white/40 text-[10px] font-black uppercase tracking-widest mb-1">Doğru</p>
                                                <p className="text-3xl font-black text-green-400">{testState.score}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-white/40 text-[10px] font-black uppercase tracking-widest mb-1">Hata</p>
                                                <p className="text-3xl font-black text-red-400">{testState.wrongCount}</p>
                                            </div>
                                            <div className="text-center">
                                                <p className="text-white/40 text-[10px] font-black uppercase tracking-widest mb-1">Başarı</p>
                                                <p className="text-3xl font-black text-blue-400">%{Math.round((testState.score / MAX_ROUNDS) * 100)}</p>
                                            </div>
                                        </div>
                                        <p className="text-white/60 font-bold text-sm mt-2">Seviye: {testState.selectedLanguageLevel}</p>
                                    </div>
                                    <div className="space-y-6 text-left">
                                        {testState.difficultWordsList.length > 0 && (
                                            <div className="space-y-3 p-4 bg-red-500/5 rounded-3xl border border-red-500/10">
                                                <h3 className="text-xs font-black text-red-400 uppercase tracking-widest flex items-center gap-2"><Icon name="AlertTriangle" size={14} /> Zor Kelimeler</h3>
                                                <div className="flex flex-wrap gap-2">
                                                    {testState.difficultWordsList.map(w => <span key={w} className="px-3 py-1 bg-red-500/10 text-red-300 border border-red-500/20 rounded-lg text-xs font-bold">{w}</span>)}
                                                </div>
                                            </div>
                                        )}
                                        {testState.learnedWordsList.length > 0 && (
                                            <div className="space-y-2">
                                                <h3 className="text-xs font-black text-green-400 uppercase tracking-widest flex items-center gap-2"><Icon name="CheckCircle2" size={14} /> Öğrenilenler</h3>
                                                <div className="flex flex-wrap gap-2">
                                                    {testState.learnedWordsList.map(w => <span key={w} className="px-3 py-1 bg-green-500/10 text-green-300 border border-green-500/20 rounded-lg text-xs font-bold">{w}</span>)}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => setTestState(s => ({ ...s, gamePhase: 'level-select' }))} className="flex-1 py-4 bg-white/10 text-white border border-white/20 rounded-2xl font-black text-sm uppercase tracking-widest">Tekrar Başla</button>
                                        <button onClick={() => setView('home')} className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest">Ana Sayfa</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="p-6 space-y-6 overflow-y-auto h-full pb-24">
                                <h2 className="text-2xl font-black">Ayarlar</h2>
                                <div className="space-y-4">
                                    <div className="p-4 bg-gray-50 rounded-2xl space-y-2">
                                        <label className="text-xs font-bold text-gray-400 uppercase">Öğrenme Dili</label>
                                        <select 
                                            value={localSettings.learningLanguage} 
                                            onChange={e => setLocalSettings({...localSettings, learningLanguage: e.target.value})} 
                                            className="w-full bg-transparent font-bold"
                                        >
                                            <option value="de">Almanca</option>
                                            <option value="en">İngilizce</option>
                                            <option value="fr">Fransızca</option>
                                        </select>
                                    </div>
                                    <div className="p-4 bg-gray-50 rounded-2xl space-y-2">
                                        <label className="text-xs font-bold text-gray-400 uppercase">Hedef Tekrar Sayısı</label>
                                        <input 
                                            type="number" 
                                            value={localSettings.targetRepetitions} 
                                            onChange={e => setLocalSettings({...localSettings, targetRepetitions: parseInt(e.target.value)})} 
                                            className="w-full bg-transparent font-bold" 
                                        />
                                    </div>
                                    <button 
                                        onClick={() => {
                                            setIsUpdatingContent(true);
                                            setTimeout(() => {
                                                setState({...state, settings: {...state.settings, ...localSettings}});
                                                setIsUpdatingContent(false);
                                                alert("Ayarlar kaydedildi!");
                                                setView('home');
                                            }, 1500);
                                        }} 
                                        className="w-full py-4 bg-green-600 text-white rounded-2xl font-black text-lg shadow-xl shadow-green-100 active:scale-95 transition-all"
                                    >
                                        Ayarları Kaydet
                                    </button>
                                </div>

                                <div className="pt-6 border-t border-gray-100 space-y-4">
                                    <h3 className="font-black text-neutral-900 flex items-center gap-2">
                                        <Icon name="PlusCircle" size={20} className="text-blue-600" />
                                        Yeni Kelime Ekle (AI)
                                    </h3>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text" 
                                            value={newWordInput} 
                                            onChange={(e) => setNewWordInput(e.target.value)}
                                            placeholder="Kelime girin (virgülle ayırabilirsiniz)..." 
                                            className="flex-1 px-4 py-3 bg-neutral-50 border border-neutral-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                        <button 
                                            onClick={handleAddWord}
                                            disabled={isAnalyzing}
                                            className="px-4 py-3 bg-blue-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-blue-100 active:scale-95 transition-all disabled:opacity-50 flex items-center gap-2"
                                        >
                                            {isAnalyzing ? (
                                              <>
                                                <Icon name="Loader2" size={18} className="animate-spin" />
                                                <span className="text-[10px]">{processingWord}</span>
                                              </>
                                            ) : "Ekle"}
                                        </button>
                                    </div>
                                    {isAnalyzing && (
                                      <p className="text-[10px] text-blue-600 font-bold animate-pulse">
                                        "{processingWord}" analiz ediliyor...
                                      </p>
                                    )}
                                    <p className="text-[10px] text-neutral-400 font-medium italic">
                                        * AI analizi ile çeviri, tür ve açıklama otomatik oluşturulur. Birden fazla kelimeyi virgülle ayırarak ekleyebilirsiniz.
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Nav */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-xl border-t border-gray-100 px-8 py-4 flex justify-between items-center z-50">
                        <button onClick={() => setView('home')} className={`p-2 rounded-xl transition-all ${view === 'home' ? 'text-blue-600 bg-blue-50' : 'text-gray-400'}`}><Icon name="Home" /></button>
                        <button onClick={() => setView('session')} className={`p-2 rounded-xl transition-all ${view === 'session' ? 'text-blue-600 bg-blue-50' : 'text-gray-400'}`}><Icon name="BrainCircuit" /></button>
                        <button onClick={startTest} className={`p-2 rounded-xl transition-all ${view === 'test' ? 'text-blue-600 bg-blue-50' : 'text-gray-400'}`}><Icon name="GraduationCap" /></button>
                        <button onClick={() => setView('settings')} className={`p-2 rounded-xl transition-all ${view === 'settings' ? 'text-blue-600 bg-blue-50' : 'text-gray-400'}`}><Icon name="User" /></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
